  function bindBody(v){
    const body = v.querySelector('#xbody');
    if(!body) return;
    body.oninput = e => {
      const el = e.target;
      if(!el.dataset.id || !el.dataset.f) return;
      const r = XP.rows.find(x => x.id === +el.dataset.id);
      if(!r) return;
      if(el.dataset.f === 'plat'){
        r.plat = el.value;
        const rate = platRate(el.value);
        if(rate !== ''){ r.comm = rate; }
        const ci = el.closest('tr').querySelector('[data-f="comm"]');
        if(ci && rate !== '') ci.value = rate;
      }else{
        r[el.dataset.f] = el.value;
      }
      refreshRow(v, r.id);
      save();
    };
    body.onclick = e => {
      const del = e.target.closest('[data-del]');
      if(del){
        const id = +del.dataset.del;
        const r = XP.rows.find(x => x.id === id);
        if(r && r.name && !confirm(`删除「${r.name}」？`)) return;
        XP.rows = XP.rows.filter(x => x.id !== id);
        if(XP.detail === id) XP.detail = null;
        save(); location.hash = '#/cross-score'; route(); return;
      }
      const ins = e.target.closest('[data-ins]');
      if(ins){
        const id = +ins.dataset.ins;
        XP.detail = (XP.detail === id) ? null : id;
        location.hash = '#/cross-score'; route();
      }
    };
  }

  function renderBody(v){
    const body = v.querySelector('#xbody');
    if(!body) return;
    const list = rowsForDisplay();
    if(!list.length){
      body.innerHTML = `<tr><td colspan="${COLS.length+1}">
        <div style="padding:30px;text-align:center;color:var(--dim2);font-size:12.5px">
        还没有品。点「+ 新增一行」开始。</div></td></tr>`;
      return;
    }
    body.innerHTML = list.map(({row: r, c}) => {
      const cells = COLS.map(col => {
        const k = col.k;
        if(k === 'name')
          return `<td class="nm txt" style="left:0"><input data-id="${r.id}" data-f="name" value="${esc2(r.name||'')}" placeholder="品名"></td>`;
        if(k === 'plat')
          return `<td><input data-id="${r.id}" data-f="plat" list="pl" value="${esc2(r.plat||'')}" placeholder="选平台"></td>`;
        if(k === '__bill') return `<td class="calc" data-c="${r.id}-bill">${c.bill?Math.round(c.bill):'—'}</td>`;
        if(k === '__gross') return `<td class="calc${c.gross!==null&&c.gross<0?' bad':''}" data-c="${r.id}-gross">${c.gross===null?'—':'$'+c.gross.toFixed(2)}</td>`;
        if(k === '__gm') return `<td class="calc${c.gm===null?'':(c.gm<0.2?' bad':' good')}" data-c="${r.id}-gm">${c.gm===null?'—':(c.gm*100).toFixed(1)+'%'}</td>`;
        if(k === '__total') return `<td class="sc stick ${c.verdict}" data-c="${r.id}-total" style="left:180px">${c.total===null?'—':c.total.toFixed(1)}</td>`;
        if(k === '__verdict') return `<td class="vd stick ${c.verdict}" data-c="${r.id}-verdict" style="left:242px">${
          c.total===null?'未完成':(c.verdict==='y'?'进池':c.verdict==='w'?'观察':'放弃')}</td>`;
        const val = (r[k] === undefined || r[k] === null) ? '' : r[k];
        return `<td><input data-id="${r.id}" data-f="${k}" inputmode="decimal" value="${esc2(val)}"></td>`;
      }).join('');
      return `<tr>${cells}<td><button class="rbtn" data-ins="${r.id}">详情</button>
        <button class="rdel" data-del="${r.id}">×</button></td></tr>`;
    }).join('');
    if(!document.getElementById('pl')){
      document.body.insertAdjacentHTML('beforeend',
        `<datalist id="pl">${XP.params.platforms.map(p=>`<option value="${esc2(p.n)}">`).join('')}</datalist>`);
    }
    bindBody(v);
  }

  function refreshRow(v, id){
    const r = XP.rows.find(x => x.id === id);
    if(!r) return;
    const c = calcRow(r, XP.params);
    const set = (k, html, cls) => {
      const el = v.querySelector(`[data-c="${id}-${k}"]`);
      if(el){ el.innerHTML = html; if(cls) el.className = cls; }
    };
    set('bill', c.bill ? Math.round(c.bill) : '—', 'calc');
    set('gross', c.gross === null ? '—' : '$' + c.gross.toFixed(2),
        'calc' + (c.gross !== null && c.gross < 0 ? ' bad' : ''));
    set('gm', c.gm === null ? '—' : (c.gm*100).toFixed(1) + '%',
        'calc' + (c.gm === null ? '' : (c.gm < 0.2 ? ' bad' : ' good')));
    set('total', c.total === null ? '—' : c.total.toFixed(1), 'sc stick ' + c.verdict);
    set('verdict', c.total === null ? '未完成'
      : (c.verdict === 'y' ? '进池' : c.verdict === 'w' ? '观察' : '放弃'),
      'vd stick ' + c.verdict);
  }

  function addRows(k, v){
    for(let i=0;i<k;i++){
      XP.rows.push(wid({ name:'', plat:'', price:'', wt:'', L:'', W:'', H:'',
        cost:'', ship:'', comm:'', tax:'0', ret:'5', other:'0',
        comp:5, dem:5, inno:5, sup:5 }));
    }
    save(); renderBody(v); toast('已新增 ' + k + ' 行');
  }

  /* ---------- 详情卡 ---------- */
  function detailCard(id){
    const r = XP.rows.find(x => x.id === id);
    if(!r) return '';
    const c = calcRow(r, XP.params), P = XP.params, W = P.w;
    const volw = c.volw || 0, wt = n(r.wt);
    const bull = wt > 0 && volw > wt * n(P.bulk);
    const dims = [
      ['物流友好度', c.sLogi, W.logi], ['毛利空间', c.sMarg, W.marg], ['退货率', c.sRet, W.ret],
      ['合规可得性', n(r.comp), W.comp], ['需求持续性', n(r.dem), W.dem],
      ['微创新度', n(r.inno), W.inno], ['补货能力', n(r.sup), W.sup]
    ];
    const weak = dims.filter(d => d[1] !== null)
      .map(d => ({name:d[0], score:d[1], w:d[2], gain:(10-d[1])*d[2]/10}))
      .sort((a,b) => b.gain - a.gain)[0];
    const adv = {
      '物流友好度':'换更小的包装、压缩空隙，或换材质减重。体积重是按长宽高算的，尺寸压下来就是纯赚。',
      '毛利空间':'要么换供应商压采购价，要么提售价（配更好的图/包装），要么挑佣金低的渠道。',
      '退货率':'服装必须给双标尺码表和实拍色号；3C 必须写清兼容型号。',
      '合规可得性':'资质办不下来就别硬上，上架后也会被下架。换品类比办证快。',
      '需求持续性':'多看两件事：同类在架商品的上架时间、同款价格带还有多少空间。',
      '微创新度':'加个盖子、换硅胶、做成套装，改动不大就能跳出比价池。',
      '补货能力':'先确认工厂日产能，3000 单 3 天能不能补上。补不上就不要冲量。'
    }[weak ? weak.name : ''] || '';
    const col = c.verdict === 'y' ? '#047857' : c.verdict === 'w' ? '#A16207' : '#BE123C';
    return `<div class="card" style="margin-bottom:12px;border-color:rgba(79,70,229,.3)">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:14px">
        <div>
          <h4 style="font-size:15px">${esc2(r.name || '未命名')}
            <span class="note" style="font-weight:400">　${esc2(r.plat || '未选平台')} · 售价 $${n(r.price)}</span></h4>
          <div style="display:flex;align-items:baseline;gap:10px;margin-top:8px">
            <span style="font-size:32px;font-weight:800;color:${col};letter-spacing:-1px">${c.total===null?'—':c.total.toFixed(1)}</span>
            <span class="note">${c.total===null?'未完成':(c.verdict==='y'?'✅ 进测款池':c.verdict==='w'?'⚠️ 待观察':'❌ 放弃')}　结论线 ≥${P.pass}</span>
          </div>
        </div>
        <button class="btn sm ghost" data-ins="${r.id}">收起</button>
      </div>
      <div class="grid g2" style="margin-top:14px">
        <div>
          <div class="note" style="color:var(--blue);margin-bottom:6px">计费重推导</div>
          <div class="ptrow"><span>实重</span><span>${wt.toFixed(0)} g</span></div>
          <div class="ptrow"><span>体积重 = ${n(r.L)}×${n(r.W)}×${n(r.H)} ÷ ${P.vol}</span><span>${volw.toFixed(0)} g</span></div>
          <div class="ptrow"><span>计费重（取较大）</span><span style="color:var(--gold)">${Math.max(wt,volw).toFixed(0)} g</span></div>
          ${bull ? `<div class="note" style="color:#BE123C;margin-top:7px">⚠️ 体积重超过实重 ${P.bulk} 倍，判为抛货，物流分扣 ${P.pen} 分。</div>` : ''}
          <div class="note" style="color:var(--blue);margin:12px 0 6px">毛利拆分</div>
          <div class="ptrow"><span>售价</span><span>$${n(r.price).toFixed(2)}</span></div>
          <div class="ptrow"><span>− 采购 / 物流</span><span>−$${(n(r.cost)+n(r.ship)).toFixed(2)}</span></div>
          <div class="ptrow"><span>− 佣金 / 税</span><span>−$${(n(r.price)*n(r.comm)/100+n(r.price)*n(r.tax)/100).toFixed(2)}</span></div>
          <div class="ptrow"><span>− 其他 / 退货损耗</span><span>−$${(n(r.other)+n(r.price)*n(r.ret)/100*P.loss).toFixed(2)}</span></div>
          <div class="ptrow"><span><b>毛利 / 毛利率</b></span><span style="color:${c.gross!==null&&c.gross<0?'#BE123C':'#047857'}">${
            c.gross===null?'—':'$'+c.gross.toFixed(2)+' / '+(c.gm*100).toFixed(1)+'%'}</span></div>
        </div>
        <div>
          <div class="note" style="color:var(--blue);margin-bottom:6px">七维加权</div>
          ${dims.map(d => `<div class="dimbar"><span class="dn">${d[0]}</span>
            <span class="db"><i style="width:${d[1]===null?0:d[1]*10}%"></i></span>
            <span class="dv">${d[1]===null?'—':d[1]} × ${d[2]}%</span></div>`).join('')}
          <div class="ptrow" style="margin-top:8px"><span>加权合计 × 10</span>
            <span style="color:#4F46E5">${c.total===null?'—':c.total.toFixed(1)} 分</span></div>
          ${weak && weak.gain > 0 ? `<div style="margin-top:12px;padding:11px 13px;border-radius:9px;
            background:rgba(255,107,53,.07);border:1px solid rgba(255,107,53,.3)" class="note">
            <b style="color:#C2410C">最值得改：${weak.name}</b>（现 ${weak.score} 分，权重 ${weak.w}%）。补到 10 分可 <b style="color:#047857">+${weak.gain.toFixed(1)}</b> 分。<br>${adv}</div>` : ''}
        </div>
      </div>
    </div>`;
  }

  /* ---------- 模块二：选品分析 ---------- */
  reg('cross-an', () => {
    const all = calcAll(), done = all.filter(x => x.c.total !== null);
    const pool = done.filter(x => x.c.verdict === 'y');
    const avg = done.length ? done.reduce((s,x)=>s+x.c.total,0)/done.length : 0;
    const gms = all.filter(x => x.c.gm !== null);
    const avgGm = gms.length ? gms.reduce((s,x)=>s+x.c.gm,0)/gms.length : 0;
    return `
    <h1>选品分析
      <small>看清楚「哪一批值得压钱」。散点图左上角是甜点区：又轻又赚钱。</small></h1>
    <div class="kpis" style="margin-top:16px">
      ${kpi('候选品', all.length, '已算完 ' + done.length)}
      ${kpi('进测款池', pool.length, done.length ? '占 ' + Math.round(pool.length/done.length*100)+'%' : '—', '#047857')}
      ${kpi('平均综合分', avg.toFixed(1), '结论线 ' + XP.params.pass)}
      ${kpi('平均毛利率', (avgGm*100).toFixed(1) + '%', '低于 20% 要警惕')}
    </div>
    <div class="grid g2">
      <div class="card"><h3 style="margin-top:0">综合分分布</h3>${histogram(done)}</div>
      <div class="card"><h3 style="margin-top:0">计费重 × 毛利率</h3>${scatter(all)}
        <div class="note" style="margin-top:8px">右下 = 又重又薄，别碰；左上 = 又轻又厚，优先测款。</div></div>
    </div>
    <h3>排名</h3>
    <div class="card">${ranking(done)}</div>
    <h3>压力测试</h3>
    <div class="card">
      <p class="note" style="margin-bottom:12px">真实环境会变。拖一下看你的池子会不会塌。</p>
      <div class="prow2"><label>物流费上浮 <b id="psL" style="color:var(--gold)">+0%</b></label>
        <input type="range" id="ps" min="100" max="200" step="5" value="100" style="flex:2"></div>
      <div class="prow2"><label>售价下调 <b id="ppL" style="color:var(--gold)">0%</b></label>
        <input type="range" id="pp" min="70" max="100" step="1" value="100" style="flex:2"></div>
      <div class="prow2"><label>退货率加码 <b id="prL" style="color:var(--gold)">+0pp</b></label>
        <input type="range" id="pr" min="0" max="20" step="1" value="0" style="flex:2"></div>
      <div id="ptOut" style="margin-top:14px"></div>
    </div>`;
  }, v => {
    const run = () => {
      const shipMul = +v.querySelector('#ps').value / 100;
      const priceMul = +v.querySelector('#pp').value / 100;
      const retAdd = +v.querySelector('#pr').value;
      v.querySelector('#psL').textContent = '+' + ((shipMul-1)*100).toFixed(0) + '%';
      v.querySelector('#ppL').textContent = '-' + ((1-priceMul)*100).toFixed(0) + '%';
      v.querySelector('#prL').textContent = '+' + retAdd + 'pp';
      const before = new Set(calcAll().filter(x => x.c.verdict === 'y').map(x => x.row.id));
      const after = calcAll({ shipMul, priceMul, retAdd })
        .filter(x => x.c.total !== null && x.c.verdict === 'y');
      const ids = new Set(after.map(x => x.row.id));
      const lost = [...before].filter(id => !ids.has(id));
      const names = lost.map(id => XP.rows.find(r => r.id === id)).filter(Boolean)
        .map(r => r.name || '未命名').slice(0, 6);
      v.querySelector('#ptOut').innerHTML = `
        <div class="kpis" style="margin:0">
          ${kpi('进池数量', after.length, '原 ' + before.size + '，掉出 ' + lost.length,
            after.length < before.size ? '#BE123C' : '#047857')}
        </div>
        ${names.length ? `<div class="note" style="color:#BE123C">掉出池子：${names.join('、')}${lost.length>6?' 等 '+lost.length+' 个':''}</div>`
          : `<div class="note" style="color:#047857">这一档冲击下，池子没有塌。</div>`}`;
    };
    ['ps','pp','pr'].forEach(id => v.querySelector('#' + id).oninput = run);
    run();
  });

  function histogram(done){
    if(!done.length) return `<div style="padding:26px;text-align:center;color:var(--dim2);font-size:12.5px">还没有算完的品</div>`;
    const bins = new Array(10).fill(0);
    done.forEach(x => bins[Math.min(9, Math.max(0, Math.floor(x.c.total/10)))]++);
    const mx = Math.max(...bins, 1);
    const W = 500, H = 200, pL = 28, pB = 24, pT = 10;
    const bw = (W - pL - 8) / 10;
    const cls = i => i >= Math.floor(XP.params.pass/10) ? '#047857'
      : i >= Math.floor(XP.params.watch/10) ? '#A16207' : '#BE123C';
    let bars = '', ticks = '';
    bins.forEach((val,i) => {
      const h = (val/mx) * (H-pT-pB), x = pL + i*bw;
      if(val) bars += `<rect x="${x+2}" y="${H-pB-h}" width="${bw-4}" height="${h}" rx="3" fill="${cls(i)}" opacity=".85"/>`;
      if(val) bars += `<text x="${x+bw/2}" y="${H-pB-h-5}" text-anchor="middle" font-size="10" fill="#3B3943">${val}</text>`;
      ticks += `<text x="${x+bw/2}" y="${H-pB+14}" text-anchor="middle" font-size="10" fill="#9A96A1">${i*10}</text>`;
    });
    return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">
      <line x1="${pL}" y1="${H-pB}" x2="${W-4}" y2="${H-pB}" stroke="#D7D2C8"/>
      ${bars}${ticks}</svg>`;
  }

  function scatter(all){
    const pts = all.filter(x => x.c.bill > 0 && x.c.gm !== null);
    if(!pts.length) return `<div style="padding:26px;text-align:center;color:var(--dim2);font-size:12.5px">还需要计费重和毛利数据</div>`;
    const W = 520, H = 300, pL = 42, pR = 12, pT = 12, pB = 30;
    const maxBill = Math.max(1200, ...pts.map(p => p.c.bill));
    const g = pts.map(p => p.c.gm*100);
    const hi = Math.max(50, Math.ceil(Math.max(...g)/10)*10), lo = Math.min(0, Math.floor(Math.min(...g)/10)*10);
    const px = b => pL + (b/maxBill)*(W-pL-pR);
    const py = v => H-pB - ((v-lo)/(hi-lo))*(H-pT-pB);
    let grid = '', lab = '';
    for(let i=0;i<=4;i++){
      const v = lo + (hi-lo)*i/4;
      grid += `<line x1="${pL}" y1="${py(v)}" x2="${W-pR}" y2="${py(v)}" stroke="#EDEAE3" stroke-dasharray="3 4"/>`;
      lab += `<text x="${pL-6}" y="${py(v)+4}" text-anchor="end" font-size="10" fill="#9A96A1">${v.toFixed(0)}%</text>`;
    }
    [0,300,500,800,1200].filter(b => b <= maxBill).forEach(b => {
      lab += `<text x="${px(b)}" y="${H-pB+15}" text-anchor="middle" font-size="10" fill="#9A96A1">${b}</text>`;
    });
    const dots = pts.map(p => {
      const col = p.c.verdict === 'y' ? '#047857' : p.c.verdict === 'w' ? '#A16207' : '#BE123C';
      return `<circle cx="${px(p.c.bill)}" cy="${py(p.c.gm*100)}" r="5.5" fill="${col}" opacity=".9"
        stroke="#FFFFFF" stroke-width="1.5"><title>${esc2(p.row.name)} · ${Math.round(p.c.bill)}g · ${(p.c.gm*100).toFixed(1)}% · ${p.c.total}分</title></circle>`;
    }).join('');
    return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">
      <rect x="${pL}" y="${pT}" width="${px(500)-pL}" height="${py(20)-pT}" fill="rgba(4,120,87,.06)" rx="4"/>
      <text x="${pL+7}" y="${py(20)-6}" font-size="10" fill="#047857">甜点区 · 轻且厚</text>
      ${grid}${lab}${dots}
      <line x1="${pL}" y1="${H-pB}" x2="${W-pR}" y2="${H-pB}" stroke="#D7D2C8"/>
      <line x1="${pL}" y1="${pT}" x2="${pL}" y2="${H-pB}" stroke="#D7D2C8"/>
      <line x1="${pL}" y1="${py(20)}" x2="${W-pR}" y2="${py(20)}" stroke="#C0563B" stroke-dasharray="4 4"/>
      <text x="${W-pR}" y="${py(20)-5}" text-anchor="end" font-size="10" fill="#C2410C">毛利 20% 底线</text>
      <text x="${W-pR}" y="${H-3}" text-anchor="end" font-size="10" fill="#9A96A1">计费重 g</text>
    </svg>`;
  }

  function ranking(done){
    if(!done.length) return `<div style="padding:20px;text-align:center;color:var(--dim2);font-size:12.5px">还没有算完的品</div>`;
    return [...done].sort((a,b) => b.c.total - a.c.total).map((x,i) => {
      const col = x.c.verdict === 'y' ? '#047857' : x.c.verdict === 'w' ? '#A16207' : '#BE123C';
      return `<div style="display:flex;align-items:center;gap:10px;padding:5px 0">
        <span style="width:20px;color:#9A96A1;font-size:11.5px;text-align:right">${i+1}</span>
        <span style="flex:0 0 190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px">${esc2(x.row.name||'未命名')}</span>
        <span class="bar" style="flex:1"><i style="width:${x.c.total}%;background:${col}"></i></span>
        <span style="width:42px;text-align:right;font-weight:700;font-size:12.5px;color:${col}">${x.c.total.toFixed(1)}</span>
        <span style="width:52px;text-align:right;font-size:11.5px;color:var(--dim)">${x.c.gm===null?'':(x.c.gm*100).toFixed(0)+'%'}</span>
      </div>`;
    }).join('');
  }

  /* ---------- 模块三：参数表 ---------- */
  function weightRow(label, k, hint){
    const val = XP.params.w[k];
    return `<div class="prow2">
      <label>${label}<span class="hint">${hint}</span></label>
      <input type="range" data-pk="w.${k}" min="0" max="50" step="1" value="${val}"
        oninput="this.nextElementSibling.value=this.value">
      <input type="number" data-pk="w.${k}" min="0" max="100" step="1" value="${val}">
      <span class="unit">%</span></div>`;
  }

  reg('cross-param', () => {
    const P = XP.params;
    return `
    <h1>模型参数
      <small>这里是唯一的数值来源。改任何一格，全表所有品立刻重算，不用改任何公式。</small></h1>
    <h3>维度权重</h3>
    <div class="card">
      ${weightRow('物流友好度','logi','计费重判分，抛货额外扣分')}
      ${weightRow('毛利空间','marg','扣完全部成本后的毛利率')}
      ${weightRow('退货率','ret','按类目基准填预期值')}
      ${weightRow('合规可得性','comp','手填 0–10')}
      ${weightRow('需求持续性','dem','手填 0–10')}
      ${weightRow('微创新度','inno','手填 0–10')}
      ${weightRow('补货能力','sup','手填 0–10')}
      <div class="wsum" id="wsum"></div>
    </div>
    <h3>结论线与系数</h3>
    <div class="grid g2">
      <div class="card">
        <div class="prow2"><label>综合分 ≥ 进测款池</label>
          <input type="number" data-pk="pass" value="${P.pass}" min="0" max="100"><span class="unit">分</span></div>
        <div class="prow2"><label>综合分 ≥ 待观察</label>
          <input type="number" data-pk="watch" value="${P.watch}" min="0" max="100"><span class="unit">分</span></div>
      </div>
      <div class="card">
        <div class="prow2"><label>退货损耗系数<span class="hint">损失按退货率的这个比例</span></label>
          <input type="number" data-pk="loss" value="${P.loss}" min="0" max="1" step="0.05"></div>
        <div class="prow2"><label>体积重系数<span class="hint">长×宽×高 ÷ 这个数</span></label>
          <input type="number" data-pk="vol" value="${P.vol}" min="1" max="10"></div>
        <div class="prow2"><label>抛货倍数<span class="hint">体积重 &gt; 实重 × 倍数</span></label>
          <input type="number" data-pk="bulk" value="${P.bulk}" min="1" max="3" step="0.1"></div>
        <div class="prow2"><label>抛货扣分</label>
          <input type="number" data-pk="pen" value="${P.pen}" min="0" max="10"><span class="unit">分</span></div>
      </div>
    </div>
    <h3>分档表</h3>
    <div class="grid g3">
      <div class="card"><h4>物流分档（计费重 g）</h4><table class="band"><tbody>
        ${P.logi.map((t,i) => `<tr><td style="color:var(--dim)">≤ <input type="number" data-band="logi" data-i="${i}" data-k="max" value="${t.max}"> g</td>
          <td style="text-align:right">得 <input type="number" data-band="logi" data-i="${i}" data-k="s" value="${t.s}"> 分</td></tr>`).join('')}
        <tr><td style="color:var(--dim)">以上全部</td>
          <td style="text-align:right">得 <input type="number" data-band="logiFb" data-k="fb" value="${P.logiFb}"> 分</td></tr>
      </tbody></table></div>
      <div class="card"><h4>毛利分档（毛利率）</h4><table class="band"><tbody>
        ${P.marg.map((t,i) => `<tr><td style="color:var(--dim)">≥ <input type="number" data-band="marg" data-i="${i}" data-k="min" value="${t.min}"> %</td>
          <td style="text-align:right">得 <input type="number" data-band="marg" data-i="${i}" data-k="s" value="${t.s}"> 分</td></tr>`).join('')}
        <tr><td style="color:var(--dim)">低于最低档</td>
          <td style="text-align:right">得 <input type="number" data-band="margFb" data-k="fb" value="${P.margFb}"> 分</td></tr>
      </tbody></table></div>
      <div class="card"><h4>退货分档（退货率）</h4><table class="band"><tbody>
        ${P.ret.map((t,i) => `<tr><td style="color:var(--dim)">≤ <input type="number" data-band="ret" data-i="${i}" data-k="max" value="${t.max}"> %</td>
          <td style="text-align:right">得 <input type="number" data-band="ret" data-i="${i}" data-k="s" value="${t.s}"> 分</td></tr>`).join('')}
        <tr><td style="color:var(--dim)">以上全部</td>
          <td style="text-align:right">得 <input type="number" data-band="retFb" data-k="fb" value="${P.retFb}"> 分</td></tr>
      </tbody></table></div>
    </div>
    <h3>平台默认佣金率</h3>
    <div class="card">
      <p class="note" style="margin-bottom:10px">打分器里选平台时，佣金率自动填这里的值。拿到特殊费率，直接在打分器覆盖那一格。</p>
      <div class="tblwrap" style="border:none;background:transparent"><table class="tbl">
        <thead><tr><th>平台 / 模式</th><th style="width:110px">默认佣金率</th><th style="width:50px"></th></tr></thead><tbody>
        ${P.platforms.map((p,i) => `<tr>
          <td><input class="inp" data-plat="${i}" data-k="n" value="${esc2(p.n)}" style="width:100%;text-align:left"></td>
          <td><input class="inp" type="number" data-plat="${i}" data-k="r" value="${p.r}" style="width:80px;text-align:right"> %</td>
          <td><button class="rdel" data-platdel="${i}">×</button></td></tr>`).join('')}
      </tbody></table></div>
      <div style="margin-top:11px;display:flex;gap:9px;flex-wrap:wrap">
        <button class="btn sm" id="addPlat">+ 新增平台</button>
        <button class="btn sm" id="syncRate">按参数表刷新全部佣金率</button>
      </div>
    </div>`;
  }, v => {
    syncSum(v);
    v.oninput = e => {
      const el = e.target;
      if(el.dataset.pk){
        const k = el.dataset.pk;
        if(k.startsWith('w.')){
          XP.params.w[k.slice(2)] = n(el.value);
          v.querySelectorAll('[data-pk="' + k + '"]').forEach(x => { if(x !== el) x.value = el.value; });
          syncSum(v);
        }else{
          XP.params[k] = n(el.value);
        }
        save();
      }else if(el.dataset.band){
        const b = el.dataset.band, k = el.dataset.k;
        if(k === 'fb') XP.params[b] = n(el.value);
        else XP.params[b][+el.dataset.i][k] = n(el.value);
        save();
      }else if(el.dataset.plat !== undefined){
        const i = +el.dataset.plat;
        if(el.dataset.k === 'n') XP.params.platforms[i].n = el.value;
        else XP.params.platforms[i].r = n(el.value);
        save();
      }
    };
    v.onclick = e => {
      const del = e.target.closest('[data-platdel]');
      if(del){
        XP.params.platforms.splice(+del.dataset.platdel, 1);
        save(); route(); return;
      }
      if(e.target.id === 'addPlat'){
        XP.params.platforms.push({ n:'新平台', r:10 });
        save(); route(); return;
      }
      if(e.target.id === 'syncRate'){
        let c = 0;
        XP.rows.forEach(r => {
          const rate = platRate(r.plat);
          if(rate !== '' && r.comm !== rate){ r.comm = rate; c++; }
        });
        save(); toast(c ? '已同步 ' + c + ' 个品的佣金率' : '佣金率已经是最新的');
      }
    };
  });

  function syncSum(v){
    const el = v.querySelector('#wsum');
    if(!el) return;
    const s = wSum(), ok = Math.abs(s-100) < 0.5;
    el.className = 'wsum' + (ok ? '' : ' bad');
    el.innerHTML = ok
      ? `✅ 权重合计 <b style="color:#047857">${s.toFixed(0)}%</b>　权重正常，分数不会失真`
      : `⚠️ 权重合计 <b style="color:#BE123C">${s.toFixed(0)}%</b>　不是 100%，综合分会失真，请调整`;
  }

  /* ---------- 对外接口 ---------- */
  function toCsv(){
    const head = ['品名','平台','售价$','实重g','长cm','宽cm','高cm','计费重g','采购$','物流$',
      '佣金%','税%','退货%','其他$','毛利$','毛利率','物流分','毛利分','退货分',
      '合规','需求','创新','补货','综合分','结论'];
    const vn = c => c.verdict === 'y' ? '进测款池' : c.verdict === 'w' ? '待观察' : '放弃';
    const lines = [head.join(',')];
    XP.rows.forEach(r => {
      const c = calcRow(r, XP.params);
      const row = [r.name, r.plat, r.price, r.wt, r.L, r.W, r.H,
        c.bill ? Math.round(c.bill) : '', r.cost, r.ship, r.comm, r.tax, r.ret, r.other,
        c.gross === null ? '' : c.gross.toFixed(2),
        c.gm === null ? '' : (c.gm*100).toFixed(1) + '%',
        c.sLogi, c.sMarg, c.sRet, r.comp, r.dem, r.inno, r.sup,
        c.total === null ? '' : c.total, c.total === null ? '未完成' : vn(c)];
      lines.push(row.map(x => {
        const s = String(x === undefined || x === null ? '' : x);
        return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
      }).join(','));
    });
    return lines.join('\n');
  }

  window.SCORE_API = {
    count: () => XP.rows.length,
    getState: () => ({ params: XP.params, rows: XP.rows, weightSum: wSum(), storageOK }),
    importState: d => {
      if(!d || !d.params || !Array.isArray(d.rows)) throw new Error('格式不对');
      XP.params = d.params;
      XP.rows = d.rows.map(wid);
      save();
    },
    pushRows: list => {
      if(!Array.isArray(list) || !list.length) return 0;
      list.forEach(x => {
        XP.rows.push(wid({
          name: x.name || '', plat: x.plat || '', price: x.price || '', wt: x.wt || '',
          L: x.L || '', W: x.W || '', H: x.H || '', cost: x.cost || '', ship: x.ship || '',
          comm: x.comm === undefined || x.comm === '' ? platRate(x.plat) : x.comm,
          tax: x.tax === undefined || x.tax === '' ? '0' : x.tax,
          ret: x.ret === undefined || x.ret === '' ? '5' : x.ret,
          other: x.other === undefined || x.other === '' ? '0' : x.other,
          comp: x.comp || 5, dem: x.dem || 5, inno: x.inno || 5, sup: x.sup || 5
        }));
      });
      save();
      return list.length;
    },
    reset: () => { XP.params = P0(); XP.rows = samples(); XP.detail = null; save(); },
    toCsv, calcRow
  };
  window.go = k => { location.hash = '#/' + k; };
})();

</script>
<script>
/* ==================== js/cross.js ==================== */
/* 蓝鲸 · 综合工作台 —— 跨境电商：选品测试台 + 数据源矩阵
 *
 * 现实：主流跨境平台（Temu / Amazon / Ozon / 美客多 / Shopee）都没有
 * 像 TikHub 那样便宜通用的公开商品 API。这块只能靠账号级授权或付费工具。
 * 所以这里做的是「桥」：把你从任何渠道拿到的商品数据，一键导进打分器。
 */
(function(){
  const esc = s => String(s === undefined || s === null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const fmtK = v => {
    if(v === null || v === undefined) return '—';
    if(v >= 10000) return (v/10000).toFixed(1) + '万';
    return String(v);
  };

  const PLATFORMS = [
    { n:'Temu', api:'❌ 无公开 API', need:'卖家后台只能看自己店铺；选品数据靠妙手/店小秘这类 ERP 的「热销榜」',
      cost:'ERP 约 20 元/店/月', alt:'妙手ERP Temu 热销榜', ok:false },
    { n:'美客多', api:'❌ 有 API 但要 token', need:'Mercado Libre 开放平台需注册应用拿 access_token；我这边的网络实测被 WAF 拦（403 PolicyAgent）',
      cost:'免费但需申请', alt:'官方 /sites/MLB/search（需 token）', ok:false },
    { n:'Ozon', api:'❌ 需 Seller API Key', need:'Seller API 只给自家店铺数据；竞品选品靠 Ozon 后台「分析」模块或 ERP',
      cost:'免费但限自家店', alt:'Ozon 卖家后台分析板块', ok:false },
    { n:'TikTok Shop', api:'⚠️ 需 Partner 资质', need:'TikTok Shop Partner Center 需企业入驻审核；选品榜在 Seller Center',
      cost:'需企业资质', alt:'TikTok Shop Seller Center 榜单', ok:false },
    { n:'Shopee', api:'⚠️ 需 Open Platform 审核', need:'Shopee Open Platform 需申请开发者账号，商品搜索接口权限受限',
      cost:'需审核', alt:'Shopee 卖家中心', ok:false },
    { n:'Amazon', api:'✅ 可抓（Best Sellers）', need:'公开榜单页，浏览器渲染后解析排名/标题/价格/评分/评论数。已接进「亚马逊选品榜」，见左侧导航',
      cost:'免费', alt:'已接入；Hot New Releases 同理', ok:true },
    { n:'抖音 / TikTok（内容侧）', api:'✅ 已接 TikHub', need:'第三方社交数据 API，$0.001/次，$5 起充',
      cost:'极低', alt:'已接入，见「抖音变现 → 日榜数据」', ok:true }
  ];

  /* ---------- 解析粘贴的商品数据 ---------- */
  const KEYMAP = {
    name: ['名称','商品','品名','标题','name','title','product','商品名称'],
    plat: ['平台','站点','platform','site'],
    price: ['价格','售价','单价','price','零售价'],
    wt: ['重量','实重','克重','weight','g'],
    L: ['长','长度','length','l'],
    W: ['宽','宽度','width','w'],
    H: ['高','高度','height','h'],
    cost: ['成本','采购','采购价','进价','cost'],
    ship: ['物流','运费','头程','尾程','ship','shipping'],
    comm: ['佣金','佣金率','commission'],
    ret: ['退货','退货率','return'],
    other: ['其他','其他成本','广告']
  };
  const ALIAS = {};
  for(const k in KEYMAP) KEYMAP[k].forEach(a => ALIAS[a.toLowerCase()] = k);

  function parseTable(text){
    const lines = text.split(/\r?\n/).filter(l => l.trim() !== '');
    if(lines.length < 2) throw new Error('至少要有表头 + 一行数据');
    const delim = (lines[0].match(/\t/g) || []).length >= (lines[0].match(/,/g) || []).length ? '\t' : ',';
    const split = l => l.split(delim).map(c => c.trim().replace(/^"|"$/g, ''));
    const head = split(lines[0]);
    const idx = {};
    head.forEach((h, i) => {
      const key = ALIAS[h.toLowerCase()];
      if(key && idx[key] === undefined) idx[key] = i;
    });
    if(idx.name === undefined) throw new Error('表头里必须有一列能认出「名称/商品/标题」');
    const out = [];
    for(let i = 1; i < lines.length; i++){
      const cells = split(lines[i]);
      if(!cells.length || !cells[idx.name]) continue;
      const g = k => idx[k] === undefined ? '' : (cells[idx[k]] || '');
      out.push({
        name: g('name'), plat: g('plat'), price: g('price'), wt: g('wt'),
        L: g('L'), W: g('W'), H: g('H'), cost: g('cost'), ship: g('ship'),
        comm: g('comm').replace('%',''), ret: g('ret').replace('%',''),
        other: g('other')
      });
    }
    return out;
  }

  /* ---------- 模块：选品测试台 ---------- */
  reg('cross-test', () => `
    <h1>选品测试台
      <small>把任何渠道拿到的商品数据倒进来，一键变成打分的候选品。</small></h1>

    <div class="gap" style="margin-top:16px">
      <b>先说清楚：没有「商品搜索」类的通用 API，但榜单页能抓。</b>
      <div style="margin-top:9px">我把六家都实测过：<b style="color:#047857">亚马逊 Best Sellers 公开页可以抓</b>，
      已经在「亚马逊选品榜」里接好了；Temu、美客多、Ozon、Shopee、eBay 全部被反爬拦掉
      （美客多 403 PolicyAgent、Shopee error 90309999、eBay Error Page、Ozon 无连接页）。
      所以这一页做两件事：<b>亚马逊自动抓</b>，其他平台靠下面的导入桥。</div>
    </div>

    <h3>各平台数据通道状态</h3>
    <div class="tblwrap"><table class="tbl">
      <thead><tr><th>平台</th><th>能否自动抓</th><th>需要什么</th><th>成本</th><th>替代方案</th></tr></thead><tbody>
      ${PLATFORMS.map(p => `<tr>
        <td><b>${esc(p.n)}</b></td>
        <td style="color:${p.ok ? '#047857' : '#BE123C'}">${esc(p.api)}</td>
        <td>${esc(p.need)}</td>
        <td style="white-space:nowrap">${esc(p.cost)}</td>
        <td class="note">${esc(p.alt)}</td>
      </tr>`).join('')}
      </tbody></table></div>

    <h3>所以这张台子怎么用</h3>
    <div class="grid g3">
      <div class="card"><h4>① 从平台页面复制</h4>
        <p class="note" style="margin-top:7px">在 Temu / 亚马逊 / Ozon 的搜索结果页，选中商品列表复制，
        贴到下面的输入框。带表头的制表符格式能自动识别。</p></div>
      <div class="card"><h4>② 从 ERP 导出</h4>
        <p class="note" style="margin-top:7px">妙手 / 店小秘的热销榜导出成 CSV，把内容粘进来。
        支持 12.3万 这类写法和 % 号。</p></div>
      <div class="card"><h4>③ 手打几行也行</h4>
        <p class="note" style="margin-top:7px">哪怕只有「名称、售价、采购价」三列也能进打分器，
        重量和尺寸后面再补——它们决定了分数高低。</p></div>
    </div>

    <h3>粘贴商品数据</h3>
    <div class="card">
      <p class="note" style="margin-bottom:9px">第一行是表头。可识别的列名：
        <code>名称</code> <code>平台</code> <code>售价</code> <code>重量</code> <code>长</code> <code>宽</code>
        <code>高</code> <code>成本</code> <code>物流</code> <code>佣金</code> <code>退货率</code> <code>其他</code>
        （英文 name / price / weight / cost 也行）</p>
      <textarea id="ctBox" rows="7" placeholder="名称&#9;售价&#9;重量&#9;长&#9;宽&#9;高&#9;采购价
折叠宠物饮水碗&#9;18&#9;180&#9;20&#9;15&#9;8&#9;5
桌面收纳盒 4件套&#9;12.5&#9;420&#9;32&#9;24&#9;12&#9;3.2"></textarea>
      <div style="margin-top:10px;display:flex;gap:9px;flex-wrap:wrap;align-items:center">
        <button class="btn primary" id="ctParse">解析预览</button>
        <button class="btn" id="ctImport" disabled>写进打分器</button>
        <button class="btn ghost" id="ctDemo">填示例</button>
        <span class="note" id="ctMsg" style="margin:0"></span>
      </div>
      <div id="ctPreview" style="margin-top:12px"></div>
    </div>`, v => {
    let parsed = [];
    const msg = t => { v.querySelector('#ctMsg').textContent = t; };
    const render = () => {
      const box = v.querySelector('#ctPreview');
      if(!parsed.length){ box.innerHTML = ''; return; }
      box.innerHTML = `<div class="note" style="margin-bottom:7px">解析到 <b style="color:#047857">${parsed.length}</b> 条：</div>
        <div class="tblwrap"><table class="tbl">
          <thead><tr><th>名称</th><th>售价</th><th>重量g</th><th>尺寸</th><th>采购</th></tr></thead><tbody>
          ${parsed.slice(0, 12).map(p => `<tr>
            <td>${esc(p.name)}</td><td class="mono">${esc(p.price || '—')}</td>
            <td class="mono">${esc(p.wt || '—')}</td>
            <td class="mono">${p.L || p.W || p.H ? esc(p.L + '×' + p.W + '×' + p.H) : '—'}</td>
            <td class="mono">${esc(p.cost || '—')}</td></tr>`).join('')}
          </tbody></table></div>
        ${parsed.length > 12 ? `<div class="note">只预览前 12 条</div>` : ''}`;
    };
    v.querySelector('#ctParse').onclick = () => {
      try{
        parsed = parseTable(v.querySelector('#ctBox').value);
        render();
        v.querySelector('#ctImport').disabled = false;
        msg('解析成功，点右边写进去');
      }catch(e){ parsed = []; render(); msg('❌ ' + e.message); v.querySelector('#ctImport').disabled = true; }
    };
    v.querySelector('#ctImport').onclick = () => {
      if(!parsed.length) return;
      const n = window.SCORE_API.pushRows(parsed);
      msg(`✅ 已写入 ${n} 条`);
      setTimeout(() => { location.hash = '#/cross-score'; }, 700);
    };
    v.querySelector('#ctDemo').onclick = () => {
      v.querySelector('#ctBox').value =
        '名称\t售价\t重量\t长\t宽\t高\t采购价\n' +
        '折叠宠物饮水碗\t18\t180\t20\t15\t8\t5\n' +
        '桌面收纳盒4件套\t12.5\t420\t32\t24\t12\t3.2\n' +
        '加厚卫衣女款\t26\t520\t30\t25\t6\t9';
      msg('已填入示例，点「解析预览」');
    };
  });

  /* ---------- 模块：数据源矩阵 ---------- */
  reg('cross-src', () => `
    <h1>数据源矩阵
      <small>每个数据源能不能自动抓、要花多少钱、需要你给什么。一眼看清该走哪条路。</small></h1>
    <div class="tblwrap" style="margin-top:18px"><table class="tbl">
      <thead><tr><th>想拿什么</th><th>数据源</th><th>状态</th><th>需要你给</th><th>成本</th></tr></thead><tbody>
      <tr><td rowspan="2"><b>抖音各赛道日榜</b></td>
        <td>TikHub 抖音视频热榜 API</td><td style="color:#047857">✅ 已接入</td>
        <td>API Key（已给）</td><td style="white-space:nowrap">$0.001/次，$5 起</td></tr>
      <tr><td>FunClaw 开放平台</td><td style="color:#A16207">🔶 需注册</td>
        <td>注册 → 加入组织 → 组织 Admin 分配 API Key</td><td>偏影视短剧，按量计费</td></tr>
      <tr><td rowspan="2"><b>CSP 前 10</b></td>
        <td>淘宝联盟 / 京粉 / 精选联盟后台</td><td style="color:#BE123C">❌ 待接入</td>
        <td>你的联盟账号导出权限</td><td>免费（你自己有）</td></tr>
      <tr><td>大淘客 / 好单库 API</td><td style="color:#A16207">🔶 需资质</td>
        <td>联盟备案 + 应用审核</td><td>按量</td></tr>
      <tr><td rowspan="4"><b>跨境选品数据</b></td>
        <td>Amazon Best Sellers 公开页</td><td style="color:#047857">✅ 已接入</td>
        <td>无</td><td>免费（浏览器渲染抓取）</td></tr>
      <tr><td>平台官方 API（Amazon SP-API / Ozon Seller / 美客多）</td><td style="color:#BE123C">❌ 需账号</td>
        <td>各平台卖家账号授权</td><td>免费但只限自家店</td></tr>
      <tr><td>付费选品工具（卖家精灵 / Jungle Scout / Keepa）</td><td style="color:#A16207">🔶 需订阅</td>
        <td>订阅账号，或导出 CSV</td><td>$49–99/月</td></tr>
      <tr><td>妙手ERP / 店小秘 热销榜</td><td style="color:#A16207">🔶 需订阅</td>
        <td>ERP 账号，导出 CSV 粘进「选品测试台」</td><td>约 20 元/店/月</td></tr>
      <tr><td><b>新闻 / 平台规则</b></td><td>IT之家、淘客Show、妙手博客</td><td style="color:#047857">✅ 已接入</td>
        <td>无</td><td>免费</td></tr>
      </tbody></table></div>

    <div class="ok" style="margin-top:16px">
      <b>一句话总结：</b>社交平台的数据能用便宜 API 拿到（TikHub），电商平台的数据拿不到
      —— 这是行业结构问题，不是工具没找对。所以「选品测试台」做成导入桥：你用任何方式拿到数据，
      我负责把它变成分数和结论。
    </div>

    <h3>开源方案（GitHub 上能直接用的）</h3>
    <div class="tblwrap"><table class="tbl">
      <thead><tr><th>项目 / 方案</th><th>覆盖</th><th>怎么用</th><th>成本</th></tr></thead><tbody>
      <tr><td><b>Douyin_TikTok_Download_API</b><br><span class="note">Evil0ctal · 21.3k stars · Apache-2.0 · 昨日仍在更新</span></td>
        <td>抖音 / TikTok / B站</td>
        <td>Docker 一键自托管，自带 REST API + <b>MCP server</b>，我可以像调 TikHub 一样调它</td>
        <td><b>0 API 费</b>（自备机器）</td></tr>
      <tr><td><b>everyinfra agent-plugins</b><br><span class="note">405 stars · MCP 插件</span></td>
        <td>Amazon + 抖音 + 小红书 + TikTok 等 106 平台 / 573 接口</td>
        <td>装 MCP 插件 + 一个 Key，Amazon 和抖音一次覆盖</td>
        <td>约 $0.56/千次</td></tr>
      <tr><td><b>GitHub Actions 当免费服务器</b></td>
        <td>任意公开页</td>
        <td>fork 采集脚本 + cron，结果 commit 回仓库；我通过 GitHub 连接器读文件</td>
        <td>免费额度够每天跑</td></tr>
      </tbody></table></div>
    <div class="note" style="margin-top:10px;color:var(--dim2)">
      注意：GitHub 连接器本身只读仓库 / issue / PR，<b>不是数据源</b>。它值钱的地方是「托管开源采集器」和「当免费跑批服务器」。
    </div>

    <h3>想升级的话，按性价比排序</h3>
    <div class="tblwrap"><table class="tbl">
      <thead><tr><th>优先级</th><th>做什么</th><th>花多少</th><th>能解锁什么</th></tr></thead><tbody>
      <tr><td>①</td><td>给联盟后台导出权限</td><td>0</td><td>CSP 各赛道前 10，最有价值的一格</td></tr>
      <tr><td>②</td><td>TikHub 充 $5</td><td>约 36 元</td><td>抖音日榜全量 + 视频搜索类接口（现在 402 的那些）</td></tr>
      <tr><td>③</td><td>妙手ERP 会员</td><td>约 20 元/店/月</td><td>Temu / Ozon / TikTok 热销榜，可导出 CSV 进选品测试台</td></tr>
      <tr><td>④</td><td>卖家精灵 / JS</td><td>$49–99/月</td><td>亚马逊选品数据，确定要做大亚马逊再买</td></tr>
      </tbody></table></div>`);

  /* ---------- 模块：亚马逊选品榜 ---------- */
  reg('cross-amz', () => {
    const A = window.AMZ || { categories: [] };
    if(!A.categories.length) return `<h1>亚马逊选品榜</h1><div class="gap">还没有数据。</div>`;
    const rows = cat => cat.items.map(it => `
      <tr>
        <td class="mono"><b>${it.rank}</b></td>
        <td style="max-width:430px">${esc(it.title)}</td>
        <td class="mono">${it.price != null ? '¥' + it.price.toFixed(2) : '—'}</td>
        <td class="mono">${it.rating != null ? it.rating : '—'}</td>
        <td class="mono">${fmtK(it.reviews)}</td>
        <td class="mono" style="color:#9A96A1">${esc(it.asin)}</td>
      </tr>`).join('');
    return `
    <h1>亚马逊选品榜
      <small>Amazon Best Sellers 实时榜 · ${A.date} 抓取 · ${A.categories.length} 个类目 · 来源：浏览器渲染解析公开页</small></h1>
    <div class="warn" style="margin-top:14px">
      <b>两个口径要说清：</b>价格是按访问 IP 定位后的人民币显示价（不是美国站 $ 售价）；标题是 Amazon 的机翻中文，原名看 ASIN。
      送进打分器时会按 7.2 粗折成美元，<b>务必用站点实际售价校正</b>。
    </div>
    ${A.categories.map(c => `
      <h3>${esc(c.cat)} <span class="note" style="font-weight:400">（前 ${c.items.length} / 榜单共 50+）</span>
        <button class="btn sm" style="margin-left:auto" data-amz="${esc(c.cat)}">送前 10 进打分器 →</button></h3>
      <div class="tblwrap"><table class="tbl">
        <thead><tr><th>#</th><th>标题</th><th>显示价</th><th>评分</th><th>评论数</th><th>ASIN</th></tr></thead>
        <tbody>${rows(c)}</tbody></table></div>`).join('')}
    <div class="ok" style="margin-top:16px">
      <b>怎么用：</b>点「送进打分器」，榜单前 10 会带着名称和折算价进选品打分器。
      然后在打分器里补三样：实测重量、长宽高、采购价 —— 补完综合分才有意义。
    </div>`;
  }, v => {
    const A = window.AMZ || { categories: [] };
    v.querySelectorAll('[data-amz]').forEach(b => b.onclick = () => {
      const c = A.categories.find(x => x.cat === b.dataset.amz);
      if(!c) return;
      const list = c.items.slice(0, 10).map(it => ({
        name: it.title.slice(0, 40),
        plat: 'Amazon',
        price: it.price != null ? (it.price / 7.2).toFixed(2) : '',
        ret: '8'
      }));
      const n = window.SCORE_API.pushRows(list);
      b.textContent = `已送 ${n} 条 ✓`;
      setTimeout(() => { location.hash = '#/cross-score'; }, 600);
    });
  });

  /* ---------- 更新「前 10 榜单」页里的说明 ---------- */
})();

</script>
<script>
/* ==================== js/rank.js ==================== */
/* 蓝鲸 · 综合工作台 —— 榜单模块
 * 读取 data/ranks.js。有数据就渲染真榜单，没有就显示接入说明（不编数字）。
 */
(function(){
  const R = window.RANKS || { empty:true, douyin:{tracks:[]}, csp:{tracks:[]}, imported:[] };
  const fmtN = v => {
    if(v === null || v === undefined) return '—';
    if(v >= 1e8){ const x = v / 1e8; return (x >= 100 ? x.toFixed(0) : x.toFixed(1)) + '亿'; }
    if(v >= 1e4){ const x = v / 1e4; return (x >= 100 ? x.toFixed(0) : x.toFixed(1)) + '万'; }
    return String(Math.round(v));
  };

  const SCHEMA_DY = [
    ['赛道', 'track', '情感语录 / 不露脸 / 打赏 / 拆书 / 服饰推荐 / 历史类 / 抖音小店'],
    ['排名', 'rank', '1–5'],
    ['标题', 'title', '视频标题'],
    ['作者', 'author', '账号昵称'],
    ['点赞', 'likes', '支持 12.3万 这种写法'],
    ['播放', 'plays', '支持 320万 这种写法'],
    ['涨粉', 'fans_gain', '当日新增粉丝'],
    ['挂车品类', 'product', '判断这条视频到底赚不赚钱'],
    ['佣金率', 'commission_pct', '数字，如 18 表示 18%'],
    ['链接', 'url', '可点击回原视频']
  ];
  const SCHEMA_CSP = [
    ['赛道', 'track', '淘宝联盟 / 京东联盟 / 抖音联盟 / 外卖 / 短剧 / 抖音小店'],
    ['排名', 'rank', '1–10'],
    ['名称', 'name', '账号 / 商品 / 达人'],
    ['类型', 'type', '账号 | 商品 | 达人'],
    ['GMV', 'gmv', '成交额，元'],
    ['佣金率', 'commission_pct', '数字，如 6 表示 6%'],
    ['收入', 'income', '佣金收入，元（不填则按 GMV×佣金率 估算）'],
    ['备注', 'note', '选填']
  ];

  function gapBlock(kind){
    const isDy = kind === 'douyin';
    const schema = isDy ? SCHEMA_DY : SCHEMA_CSP;
    return `
    <div class="gap" style="margin-top:16px">
      <b>现在是空的，因为这块数据要登录才能拿。</b>
      <div style="margin-top:9px">抖音的搜索结果直接跳验证码（我实测过），蝉妈妈和抖音指数的榜单都要登录。
      我不会绕过登录，也不会编排名。</div>
    </div>

    <h3>三条真能走通的路</h3>
    <div class="grid g3">
      <div class="card">
        <h4>① 你导出 CSV，我解析 <span class="tag" style="background:rgba(4,120,87,.14);color:#047857">今天就能用</span></h4>
        <p class="note" style="margin-top:7px">把你账号里的榜单导出成 CSV，丢进 <code>data/inbox/</code>，
        我跑一次脚本就接进工作台。零成本，唯一门槛是你有那个账号。</p>
        <div class="note" style="margin-top:7px;color:var(--dim2)">支持蝉妈妈 / 飞瓜 / 新抖 / 联盟后台的任何导出格式，我按表头自动认列。</div>
      </div>
      <div class="card">
        <h4>② 接第三方数据 API</h4>
        <p class="note" style="margin-top:7px">蝉妈妈、飞瓜都有「数据开放平台」，付费后给 API Key。
        给我 Key，我写成每天自动拉。</p>
        <div class="note" style="margin-top:7px;color:var(--dim2)">门槛：要买他们企业版，通常年费几万起。</div>
      </div>
      <div class="card">
        <h4>③ 官方开放平台</h4>
        <p class="note" style="margin-top:7px">抖音开放平台、精选联盟、淘宝联盟、京东联盟都有 API，但都要企业资质 + 权限审批。</p>
        <div class="note" style="margin-top:7px;color:var(--dim2)">门槛：个人开发者基本拿不到榜单类权限。</div>
      </div>
    </div>

    <h3>CSV 需要这些列（列名用中文或英文都行）</h3>
    <div class="tblwrap"><table class="tbl">
      <thead><tr><th>含义</th><th>列名</th><th>说明</th></tr></thead><tbody>
      ${schema.map(s => `<tr><td><b>${s[0]}</b></td><td><code>${s[1]}</code></td><td>${s[2]}</td></tr>`).join('')}
      </tbody></table></div>

    <div class="ok" style="margin-top:14px">
      <b>格式模板已经放好了：</b><code>data/inbox/_示例_抖音日榜.csv</code> 和 <code>_示例_CSP前10.csv</code>，
      打开照着填，然后把文件名开头的下划线去掉，放进同目录，我再跑 <code>python tools/import_ranks.py</code>。
    </div>`;
  }

  function dyPage(){
    const d = R.douyin || { tracks:[] };
    const has = (d.tracks || []).some(t => (t.items || []).length);
    if(!has) {
      return `
      <h1>抖音日榜数据
        <small>各赛道每日点赞 / 播放前 5 的视频。有数据才显示，没有不编。</small></h1>
      ${gapBlock('douyin')}
      ${importedBlock()}`;
    }
    return `
    <h1>抖音日榜数据
      <small>${esc(d.date || '')} · 来源：${esc(d.source || '手动导入')} · 共 ${d.tracks.length} 个赛道 · 抓取于 ${esc(d.fetchedAt || '—')}</small></h1>
    ${d.note ? `<div class="note" style="margin-top:8px;color:var(--dim2)">⚠️ ${esc(d.note)}</div>` : ''}
    ${(d.pending || []).length ? `<div class="warn" style="margin-top:12px">
      本轮还没跑的赛道：<b>${d.pending.map(esc).join('、')}</b>。每天 08:00 的定时任务会把它们补齐。</div>` : ''}
    ${d.tracks.map(t => `
      <h3>${esc(t.track)} <span class="note" style="font-weight:400">（${(t.items||[]).length} 条${t.keyword ? ' · 关键词「' + esc(t.keyword) + '」' : ''}）</span></h3>
      <div class="tblwrap"><table class="tbl">
        <thead><tr><th>#</th><th>标题</th><th>作者</th><th>播放</th><th>点赞</th><th>点赞率</th><th>当日涨粉</th></tr></thead>
        <tbody>${(t.items||[]).map(it => `<tr>
          <td><b>${it.rank}</b></td>
          <td style="max-width:420px">${it.url ? `<a href="${esc(it.url)}" target="_blank" rel="noopener" style="text-decoration:none;border-bottom:1px solid #D7D2C8">${esc(it.title)}</a>` : esc(it.title)}</td>
          <td style="white-space:nowrap">${esc(it.author)}</td>
          <td class="mono">${fmtN(it.plays)}</td>
          <td class="mono">${fmtN(it.likes)}</td>
          <td class="mono" style="color:${it.likeRate >= 5 ? '#047857' : 'inherit'}">${it.likeRate != null ? it.likeRate + '%' : '—'}</td>
          <td class="mono" style="color:#047857">${fmtN(it.fansGain)}</td>
        </tr>`).join('')}</tbody></table></div>`).join('')}
    ${importedBlock()}`;
  }

  function cspPage(){
    const d = R.csp || { tracks:[] };
    const has = (d.tracks || []).some(t => (t.items || []).length);
    if(!has){
      return `
      <h1>CSP 前 10 榜单
        <small>各赛道排名前 10 的账号 / 商品 / 达人。有数据才显示。</small></h1>
      ${gapBlock('csp')}
      ${importedBlock()}`;
    }
    return `
    <h1>CSP 前 10 榜单
      <small>${esc(d.date || '')} · 来源：${esc(d.source || '手动导入')} · 共 ${d.tracks.length} 个赛道</small></h1>
    ${d.tracks.map(t => `
      <h3>${esc(t.track)}</h3>
      <div class="tblwrap"><table class="tbl">
        <thead><tr><th>#</th><th>名称</th><th>类型</th><th>GMV</th><th>佣金率</th><th>收入</th><th>备注</th></tr></thead>
        <tbody>${(t.items||[]).map(it => {
          const inc = (it.income !== null && it.income !== undefined) ? it.income
            : (it.gmv && it.commissionPct ? it.gmv * it.commissionPct / 100 : null);
          return `<tr>
            <td><b>${it.rank}</b></td>
            <td>${esc(it.name)}</td>
            <td>${esc(it.type || '—')}</td>
            <td class="mono">${it.gmv ? '¥' + fmtN(it.gmv) : '—'}</td>
            <td class="mono">${it.commissionPct != null ? it.commissionPct + '%' : '—'}</td>
            <td class="mono" style="color:#047857">${inc ? '¥' + fmtN(inc) : '—'}</td>
            <td class="note">${esc(it.note || '')}</td>
          </tr>`;
        }).join('')}</tbody></table></div>`).join('')}
    ${importedBlock()}`;
  }

  function importedBlock(){
    const list = R.imported || [];
    if(!list.length) return '';
    return `<h3>导入记录</h3>
    <div class="tblwrap"><table class="tbl">
      <thead><tr><th>时间</th><th>文件</th><th>类型</th><th>行数</th></tr></thead><tbody>
      ${list.slice().reverse().map(x => `<tr><td class="mono">${esc(x.at)}</td><td>${esc(x.file)}</td>
        <td>${x.kind === 'douyin' ? '抖音日榜' : 'CSP 榜单'}</td><td class="mono">${x.rows}</td></tr>`).join('')}
      </tbody></table></div>`;
  }

  const esc = s => String(s === undefined || s === null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

  reg('dy-rank', dyPage);
  reg('csp-top10r', cspPage);
})();

</script>
<script>boot();</script>
</body>
</html>
