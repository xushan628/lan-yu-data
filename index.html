<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>蓝鲸 · 综合工作台</title>
<style>
:root{
  --ink:#F7F6F3;
  --side:#FFFFFF;
  --panel:#FFFFFF;
  --panel2:#F3F1EC;
  --line:#E8E4DC;
  --line2:#D7D2C8;
  --text:#17161B;
  --dim:#6B6874;
  --dim2:#9A96A1;
  --accent:#4F46E5;
  --accent2:#FF6B35;
  --blue:#4F46E5;
  --green:#047857;
  --gold:#A16207;
  --red:#BE123C;
  --violet:#7C3AED;
  --input:#FFFFFF;
  --shadow:0 1px 2px rgba(23,22,27,.045), 0 10px 30px -18px rgba(23,22,27,.18);
  --shadow-lg:0 1px 2px rgba(23,22,27,.05), 0 24px 60px -28px rgba(23,22,27,.28);
  --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--ink); color:var(--text); font-size:14px; line-height:1.65;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
  font-feature-settings:"kern" 1,"liga" 1;
  overflow:hidden;
}
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(720px 420px at 12% -8%, rgba(79,70,229,.10), transparent 62%),
    radial-gradient(680px 400px at 92% -6%, rgba(255,107,53,.09), transparent 62%),
    radial-gradient(900px 600px at 50% 110%, rgba(4,120,87,.05), transparent 65%);
}
a{color:inherit}
::selection{background:rgba(79,70,229,.16)}

/* ================= 布局 ================= */
.app{display:flex; height:100vh; overflow:hidden; position:relative; z-index:1}

/* 侧栏 */
.side{
  width:246px; flex:0 0 246px; background:var(--side); border-right:1px solid var(--line);
  display:flex; flex-direction:column; z-index:40; transition:transform .24s cubic-bezier(.4,0,.2,1);
  box-shadow:1px 0 0 rgba(23,22,27,.02);
}
.sbrand{padding:20px 20px 16px}
.sbrand .t{
  font-size:17px; font-weight:800; letter-spacing:-.3px; line-height:1.25;
  background:linear-gradient(96deg,#17161B 0%,#4F46E5 78%);
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
}
.sbrand .t em{font-style:normal}
.sbrand .s{font-size:11px; color:var(--dim2); margin-top:3px; letter-spacing:.8px}
.snav{flex:1; overflow-y:auto; padding:4px 12px 24px; scrollbar-width:thin}
.snav::-webkit-scrollbar{width:6px}
.snav::-webkit-scrollbar-thumb{background:#E2DED6; border-radius:3px}
.sgroup{margin-top:16px}
.sgroup:first-child{margin-top:2px}
.sglabel{
  font-size:10px; color:var(--dim2); letter-spacing:1.2px; padding:6px 10px 7px;
  font-weight:700; text-transform:uppercase;
}
.sitem{
  display:flex; align-items:center; gap:10px; padding:8px 11px; border-radius:9px; cursor:pointer;
  color:var(--dim); font-size:13px; border:none; background:none; width:100%; text-align:left;
  font-family:inherit; transition:background .14s,color .14s; line-height:1.35; position:relative;
}
.sitem:hover{background:#F1EFEA; color:var(--text)}
.sitem.on{background:rgba(79,70,229,.09); color:var(--accent); font-weight:650}
.sitem.on::before{
  content:""; position:absolute; left:-12px; top:50%; transform:translateY(-50%);
  width:3px; height:16px; border-radius:0 3px 3px 0; background:var(--accent);
}
.sitem .ico{width:16px; text-align:center; font-size:12px; flex:0 0 16px; opacity:.55}
.sitem.on .ico{opacity:1}
.sfoot{padding:13px 18px; border-top:1px solid var(--line); font-size:11px; color:var(--dim2); line-height:1.6}
.sfoot .dot{display:inline-block; width:6px; height:6px; border-radius:50%; background:#10B981; margin-right:6px}

/* 主区 */
.main{flex:1; display:flex; flex-direction:column; min-width:0}
.chead{
  height:58px; flex:0 0 58px; display:flex; align-items:center; gap:14px; padding:0 26px;
  border-bottom:1px solid var(--line); background:rgba(23,22,27,.82);
  backdrop-filter:blur(18px) saturate(1.4); -webkit-backdrop-filter:blur(18px) saturate(1.4);
}
.burger{
  display:none; background:#fff; border:1px solid var(--line); color:var(--text);
  width:34px; height:34px; border-radius:9px; cursor:pointer; font-size:15px; font-family:inherit
}
.crumb{font-size:13px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.crumb b{color:var(--text); font-weight:650}
.chead .right{margin-left:auto; display:flex; align-items:center; gap:13px; font-size:11.5px; color:var(--dim2)}
.view{flex:1; overflow-y:auto; padding:30px 30px 100px; scroll-behavior:smooth}
.view::-webkit-scrollbar{width:10px}
.view::-webkit-scrollbar-thumb{background:#DDD8CF; border-radius:6px; border:3px solid var(--ink)}
.view::-webkit-scrollbar-track{background:transparent}
.inner{max-width:1200px; margin:0 auto}

/* ================= 排版 ================= */
h1{font-size:26px; font-weight:800; letter-spacing:-.7px; line-height:1.32}
h1 small{display:block; font-size:13px; color:var(--dim); font-weight:400; letter-spacing:0; margin-top:7px; line-height:1.75}
h2{font-size:18px; font-weight:750; margin:0 0 4px; letter-spacing:-.3px}
h3{
  font-size:13px; font-weight:700; margin:30px 0 13px; display:flex; align-items:center; gap:9px;
  color:var(--dim); letter-spacing:.6px; text-transform:uppercase;
}
h3::before{content:""; width:16px; height:2px; background:var(--accent); border-radius:2px; opacity:.85}
h4{font-size:13.5px; font-weight:700; margin-bottom:7px; letter-spacing:-.1px}
p{color:#3B3943}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12px;
  background:#F1EFEA; padding:1px 5px; border-radius:5px; color:#4A3FB8}

/* 卡片 */
.card{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
  padding:18px 20px; box-shadow:var(--shadow);
}
.grid{display:grid; gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:1100px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:820px){.g2,.g3,.g4{grid-template-columns:1fr}}
.note{font-size:12px; color:var(--dim); line-height:1.78}
.note b{color:var(--text)}
.tag{display:inline-block; font-size:10.5px; padding:2.5px 9px; border-radius:6px; font-weight:650; letter-spacing:.3px}
.mono{font-variant-numeric:tabular-nums}

/* 按钮 */
.btn{
  background:#fff; border:1px solid var(--line2); color:var(--text); border-radius:9px;
  padding:8px 14px; font-size:12.5px; cursor:pointer; font-family:inherit; transition:.15s;
  display:inline-flex; align-items:center; gap:6px; white-space:nowrap; font-weight:550;
  box-shadow:0 1px 2px rgba(23,22,27,.04);
}
.btn:hover{border-color:#BEB8AC; background:#FCFBF9; transform:translateY(-1px)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:#fff; box-shadow:0 4px 14px -6px rgba(79,70,229,.6)}
.btn.primary:hover{background:#4338CA}
.btn.ghost{background:transparent; box-shadow:none}
.btn.sm{padding:5px 11px; font-size:11.5px}
.inp{
  background:#fff; border:1px solid var(--line2); border-radius:9px; color:var(--text);
  padding:8px 12px; font-size:12.5px; font-family:inherit; outline:none; transition:.15s
}
.inp:focus{border-color:var(--accent); box-shadow:0 0 0 3px rgba(79,70,229,.12)}
select.inp{cursor:pointer}
.chips{display:flex; gap:8px; flex-wrap:wrap; margin:16px 0 18px}
.chip{
  background:#fff; border:1px solid var(--line2); color:var(--dim); border-radius:99px;
  padding:5.5px 14px; font-size:12px; cursor:pointer; font-family:inherit; transition:.14s; font-weight:550
}
.chip:hover{border-color:#BEB8AC; color:var(--text)}
.chip.on{background:var(--text); color:#fff; border-color:var(--text); box-shadow:0 4px 12px -6px rgba(23,22,27,.5)}

/* KPI */
.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(138px,1fr)); gap:13px; margin-bottom:18px}
.kpi{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
  padding:15px 17px; box-shadow:var(--shadow); position:relative; overflow:hidden;
}
.kpi::after{
  content:""; position:absolute; right:-30px; top:-30px; width:80px; height:80px; border-radius:50%;
  background:radial-gradient(circle,rgba(79,70,229,.07),transparent 70%);
}
.kpi .lb{font-size:10.5px; color:var(--dim2); letter-spacing:.7px; font-weight:600}
.kpi .vl{font-size:25px; font-weight:800; margin-top:5px; letter-spacing:-.2px; font-variant-numeric:tabular-nums; line-height:1.15}
.kpi .sub{font-size:11px; color:var(--dim); margin-top:3px}

/* 表格 */
.tbl{width:100%; border-collapse:collapse; font-size:12.5px}
.tbl th{
  text-align:left; color:var(--dim); font-size:10.5px; letter-spacing:.6px; padding:11px 12px;
  border-bottom:1px solid var(--line); background:#FBFAF7; white-space:nowrap; font-weight:700;
  text-transform:uppercase;
}
.tbl td{padding:11px 12px; border-bottom:1px solid #F1EEE8; color:#3B3943; vertical-align:top}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr{transition:background .12s}
.tbl tbody tr:hover{background:#FBFAF7}
.tbl td b{color:var(--text)}
.tblwrap{border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; background:var(--panel); box-shadow:var(--shadow)}
.tblwrap .tbl{margin:0}

ul.dot{list-style:none; margin:6px 0}
ul.dot li{position:relative; padding-left:16px; margin-bottom:8px; font-size:12.5px; color:#3B3943; line-height:1.7}
ul.dot li::before{content:""; position:absolute; left:2px; top:9px; width:5px; height:5px; border-radius:50%; background:var(--accent); opacity:.55}

/* 要闻 */
.news{
  display:flex; gap:18px; padding:20px; border:1px solid var(--line); border-radius:var(--radius);
  background:var(--panel); margin-bottom:13px; position:relative; overflow:hidden;
  box-shadow:var(--shadow); transition:transform .16s, box-shadow .16s;
}
.news:hover{transform:translateY(-2px); box-shadow:var(--shadow-lg)}
.news::before{content:""; position:absolute; left:0; top:0; bottom:0; width:3px;
  background:linear-gradient(180deg,var(--accent),var(--accent2))}
.news .rank{flex:0 0 40px; font-size:27px; font-weight:800; color:#E4E0D8; line-height:1.1; letter-spacing:-1px}
.news .b{flex:1; min-width:0}
.news h4{font-size:15px; line-height:1.55; margin-bottom:10px; font-weight:700}
.news h4 a{text-decoration:none; border-bottom:1px solid var(--line2)}
.news h4 a:hover{color:var(--accent); border-color:var(--accent)}
.why{margin-top:10px; padding:11px 14px; background:rgba(79,70,229,.055);
  border-left:2px solid var(--accent); border-radius:0 8px 8px 0; font-size:13px; color:#3B3943}
.why b{color:var(--accent)}
.act{margin-top:8px; padding:11px 14px; background:rgba(4,120,87,.055);
  border-left:2px solid var(--green); border-radius:0 8px 8px 0; font-size:13px; color:#3B3943}
.act b{color:var(--green)}
.src{font-size:11px; color:var(--dim2); margin-top:9px}
.src a{color:var(--dim); text-decoration:none; border-bottom:1px dotted var(--line2)}
.src a:hover{color:var(--accent)}

/* 提示框 */
.warn{background:#FFFBEB; border:1px solid #FDE68A; border-radius:var(--radius); padding:15px 17px;
  font-size:12.5px; color:#713F12; line-height:1.75}
.warn b{color:#A16207}
.gap{background:#FFF1F2; border:1px solid #FECDD3; border-radius:var(--radius); padding:15px 17px;
  font-size:12.5px; color:#881337; line-height:1.75}
.gap b{color:#BE123C}
.ok{background:#ECFDF5; border:1px solid #A7F3D0; border-radius:var(--radius); padding:15px 17px;
  font-size:12.5px; color:#064E3B; line-height:1.75}
.ok b{color:var(--green)}

/* 架构 */
.arch{display:grid; grid-template-columns:repeat(4,1fr); gap:12px}
@media(max-width:900px){.arch{grid-template-columns:repeat(2,1fr)}}
.alayer{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow)}
.alayer .n{font-size:10px; color:var(--accent); letter-spacing:1.2px; font-weight:800; text-transform:uppercase}
.alayer .t2{font-size:14px; font-weight:750; margin:6px 0 7px; letter-spacing:-.2px}
.alayer .d{font-size:11.5px; color:var(--dim); line-height:1.65}

/* 小部件 */
.bar{height:7px; background:#F0EDE7; border-radius:5px; overflow:hidden}
.bar i{display:block; height:100%; border-radius:5px; transition:width .4s}
.kv{display:flex; justify-content:space-between; gap:14px; padding:8px 0; border-bottom:1px dashed #EDEAE3; font-size:12.5px}
.kv:last-child{border:none}
.kv span:first-child{color:var(--dim)}
.kv span:last-child{font-weight:600; font-variant-numeric:tabular-nums; text-align:right}
.pill{display:inline-block; font-size:10.5px; padding:2.5px 9px; border-radius:99px;
  border:1px solid var(--line2); color:var(--dim); margin:0 5px 5px 0; background:#FCFBF9}

/* 计算器 */
.calcrow{display:flex; align-items:center; gap:11px; padding:9px 0; border-bottom:1px dashed #EDEAE3}
.calcrow:last-child{border:none}
.calcrow label{flex:1; color:#3B3943; font-size:12.5px}
.calcrow .hint{display:block; font-size:10.5px; color:var(--dim2); margin-top:2px}
.calcrow input[type=number],.calcrow input[type=text],.calcrow select{
  width:96px; background:#fff; border:1px solid var(--line2); border-radius:7px;
  color:var(--text); padding:6px 9px; font-size:12.5px; text-align:right; font-family:inherit; outline:none
}
.calcrow input:focus{border-color:var(--accent); box-shadow:0 0 0 3px rgba(79,70,229,.1)}
.calcrow select{text-align:left; width:160px}
.calcrow .unit{color:var(--dim2); font-size:11px; width:24px}
input[type=range]{
  -webkit-appearance:none; height:5px; border-radius:3px; background:#E8E4DC; outline:none; flex:1; min-width:80px
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none; width:15px; height:15px; border-radius:50%; background:#fff;
  border:3px solid var(--accent); cursor:pointer; box-shadow:0 2px 6px rgba(79,70,229,.32)
}
.bigv{font-size:31px; font-weight:800; letter-spacing:-1.4px; font-variant-numeric:tabular-nums}

/* 开关条 */
.toast{
  position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(18px); z-index:200;
  background:#17161B; color:#fff; padding:11px 20px; border-radius:11px; font-size:12.5px;
  opacity:0; pointer-events:none; transition:.26s cubic-bezier(.4,0,.2,1);
  box-shadow:0 12px 32px -10px rgba(23,22,27,.55);
}
.toast.on{opacity:1; transform:translateX(-50%)}
.scrim{display:none; position:fixed; inset:0; background:rgba(23,22,27,.4); z-index:35; backdrop-filter:blur(2px)}

@media(max-width:900px){
  .side{position:fixed; left:0; top:0; bottom:0; transform:translateX(-100%); box-shadow:var(--shadow-lg)}
  .side.open{transform:none}
  .burger{display:block}
  .scrim.on{display:block}
  .view{padding:20px 16px 80px}
  .chead{padding:0 15px}
  h1{font-size:22px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="sbrand">

      <div class="s">六大模块 · 数据驱动</div>
    </div>
    <nav class="snav" id="snav"></nav>
    <div class="sfoot">
      <span class="dot" id="sDot"></span><span id="sTxt">数据已加载</span>
    </div>
  </aside>

  <div class="main">
    <header class="chead">
      <button class="burger" id="burger">☰</button>

</div>
<div class="scrim" id="scrim"></div>
<div class="toast" id="toast"></div>

<script>
/* ==================== js/remote.js ==================== */
/* 蓝鲸 · 综合工作台 —— GitHub 数据同步
 *
 * 背景：raw.githubusercontent.com 在国内访问不通，但 api.github.com 可以。
 * 所以让页面自己去取：fetch API → base64 解码 → 存 localStorage → 覆盖数据 → 渲染。
 *
 * 用法：
 *   1. 自动：页面加载时若本地已有缓存，自动套用
 *   2. 手动：点右上角「同步数据」按钮，重新从 GitHub 拉一次
 */
(function(){
  var REPO = 'xushan628/lan-yu-data';
  var PATH = 'data/latest.json';
  var KEY = 'gh_latest';
  var API = 'https://api.github.com/repos/' + REPO + '/contents/' + PATH;

  function decodeUTF8(b64){
    var bin = atob(String(b64).replace(/\s/g, ''));
    var bytes = new Uint8Array(bin.length);
    for(var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder('utf-8').decode(bytes);
  }

  function trackItems(list){
    return (list || []).map(function(it, i){
      return {
        rank: it.rank || i + 1,
        title: it.title || '',
        author: it.author || '',
        plays: it.plays, likes: it.likes,
        fansGain: it.fansGain, fans: it.fans,
        likeRate: it.likeRate,
        awemeId: it.awemeId, url: it.url || '',
        price: it.price, rating: it.rating, reviews: it.reviews, asin: it.asin
      };
    });
  }

  function apply(d){
    if(!d) return null;
    var info = { date: d.generatedDate || '', at: d.generatedAt || '', tracks: 0, items: 0, cats: 0, amz: 0 };

    if(d.douyin && d.douyin.tracks && d.douyin.tracks.length){
      var tracks = d.douyin.tracks.map(function(t){
        return { track: t.track, keyword: t.keyword || '', items: trackItems(t.items) };
      }).filter(function(t){ return t.items.length; });
      if(tracks.length){
        window.RANKS = window.RANKS || {};
        window.RANKS.empty = false;
        window.RANKS.douyin = {
          date: d.douyin.date || d.generatedDate || '',
          source: (d.douyin.source || 'GitHub Actions') + ' · 经 API 同步',
          fetchedAt: d.douyin.fetchedAt || d.generatedAt || '',
          note: d.douyin.note || '',
          tracks: tracks,
          pending: d.douyin.pending || []
        };
        info.tracks = tracks.length;
        info.items = tracks.reduce(function(s, t){ return s + t.items.length; }, 0);
      }
    }

    if(d.amazon && d.amazon.categories && d.amazon.categories.length){
      var cats = d.amazon.categories.map(function(c){
        return {
          cat: c.cat, slug: c.slug, total: (c.items || []).length,
          items: trackItems(c.items)
        };
      }).filter(function(c){ return c.items.length; });
      if(cats.length){
        window.AMZ = {
          date: d.amazon.date || d.generatedDate || '',
          fetchedAt: d.amazon.fetchedAt || '',
          source: (d.amazon.source || 'Amazon Best Sellers') + ' · 经 API 同步',
          note: d.amazon.note || '',
          categories: cats
        };
        info.cats = cats.length;
        info.amz = cats.reduce(function(s, c){ return s + c.items.length; }, 0);
      }
    }
    window.GH_INFO = info;
    return info;
  }

  /* 页面加载时：用本地缓存覆盖（缓存由上次同步写入） */
  try{
    var cached = localStorage.getItem(KEY);
    if(cached) apply(JSON.parse(cached));
  }catch(e){ console.warn('[gh] 缓存读取失败', e); }

  /* 打开页面后静默拉一次最新：这样「后台数据变了，页面就是新的」 */
  function autoSync(){
    var last = parseInt(localStorage.getItem(KEY + '_ts') || '0', 10);
    if(Date.now() - last < 60 * 1000) return;          // 60 秒内不重复拉
    fetch(API, { cache: 'no-store' })
      .then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function(j){
        var text = decodeUTF8(j.content || '');
        var prev = localStorage.getItem(KEY);
        localStorage.setItem(KEY, text);
        localStorage.setItem(KEY + '_at', new Date().toISOString());
        localStorage.setItem(KEY + '_ts', String(Date.now()));
        if(prev !== text){
          // 数据有变化：重载一次，让各模块用新数据重新渲染
          if(sessionStorage.getItem('gh_reloaded') !== '1'){
            sessionStorage.setItem('gh_reloaded', '1');
            location.reload();
            return;
          }
          apply(JSON.parse(text));
        }
      })
      .catch(function(){ /* 静默失败，用缓存 */ });
  }
  if(document.readyState === 'complete') setTimeout(autoSync, 400);
  else window.addEventListener('load', function(){ setTimeout(autoSync, 400); });

  /* 手动同步 */
  window.syncFromGitHub = function(){
    var btns = document.querySelectorAll('[data-gh-sync]');
    btns.forEach(function(b){ b.disabled = true; b.textContent = '同步中…'; });
    return fetch(API, { cache: 'no-store' })
      .then(function(r){
        if(!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function(j){
        var text = decodeUTF8(j.content || '');
        var d = JSON.parse(text);
        localStorage.setItem(KEY, text);
        localStorage.setItem(KEY + '_at', new Date().toISOString());
        var info = apply(d);
        if(window.toast) window.toast('已同步：抖音 ' + info.tracks + ' 赛道 ' + info.items + ' 条 · 亚马逊 ' + info.cats + ' 类目 ' + info.amz + ' 条');
        setTimeout(function(){ location.reload(); }, 900);
      })
      .catch(function(e){
        if(window.toast) window.toast('同步失败：' + String(e.message || e).slice(0, 60));
        btns.forEach(function(b){ b.disabled = false; b.textContent = '同步数据'; });
      });
  };

  /* 顶部加按钮 + 数据来源提示 */
  function mountHeader(){
    var right = document.querySelector('.chead .right');
    if(!right || document.querySelector('[data-gh-sync]')) return;
    var btn = document.createElement('button');
    btn.className = 'btn sm';
    btn.setAttribute('data-gh-sync', '1');
    btn.textContent = '同步数据';
    btn.style.cssText = 'font-size:11.5px;padding:4px 11px';
    btn.onclick = function(){ window.syncFromGitHub(); };
    right.insertBefore(btn, right.firstChild);

    var last = localStorage.getItem(KEY + '_at');
    if(window.GH_INFO && window.GH_INFO.tracks){
      var tip = document.createElement('span');
      tip.style.cssText = 'font-size:10.5px;color:#047857;font-weight:600';
      tip.textContent = 'GitHub ' + (window.GH_INFO.date || '') +
        ' · 抖音 ' + window.GH_INFO.items + ' 条';
      right.insertBefore(tip, right.firstChild);
    }
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mountHeader);
  else setTimeout(mountHeader, 0);
})();

</script>

/* ================= 架构与方法 ================= */
reg('arch', () => `

  <h3>四层结构</h3>

    <div class="alayer"><div class="n">03 分析层</div><div class="t2">分析大脑</div>
      <div class="d">三个真实计算引擎：7 维选品打分、显存估算、CSP 佣金结构模拟。不是静态表格，输入变结果就变。</div></div>
    <div class="alayer"><div class="n">04 呈现层</div><div class="t2">总结呈现</div>
      <div class="d">总览页把跨模块的结论压成「今天先做 3 件事」，其余细节按需下钻。先给判断，再给依据。</div></div>
  </div>

  <h3>底层逻辑：为什么这样分类</h3>
  <div class="tblwrap"><table class="tbl">
    <thead><tr><th>判断标准</th><th>怎么用</th></tr></thead><tbody>
    <tr><td><b>可执行性优先</b></td><td>每条信息必须能落成动作。写不出「今天能做什么」的，不进要闻。</td></tr>
    <tr><td><b>可验证优先</b></td><td>每个数字标来源和日期。拿不到就说拿不到，标「待接入」，不填估算值。</td></tr>
    <tr><td><b>跨模块交叉</b></td><td>单条信息价值有限，交叉才有洞察。比如「芯片出口 +137%」本身是宏观，但和「跨境 3C 采购成本」交叉，就变成定价策略。</td></tr>
    <tr><td><b>结论前置</b></td><td>总览先给 3 件事，模块页再给依据。不让人从一堆数据里自己找结论。</td></tr>

      <p class="note" style="margin-top:6px">综合分 =（物流分×25% + 毛利分×20% + 退货分×15% + 合规×15% + 需求×10% + 创新×10% + 补货×5%）×10</p>
      <p class="note" style="margin-top:8px">核心在体积重：体积重 = 长×宽×高÷6，计费重取实重与体积重的较大值。抛货额外扣分。</p>

      <button class="btn sm" style="margin-top:11px" data-go="oss-calc">去算 →</button></div>
    <div class="card"><h4>③ CSP 佣金结构</h4>
      <p class="note" style="margin-top:6px">收入 = Σ(GMV_i × 佣金率_i)。同一个 GMV 在不同平台佣金差一倍，所以「换结构」比「冲规模」见效快。</p>
      <button class="btn sm" style="margin-top:11px" data-go="csp-sim">去算 →</button></div>
  </div>

        <select id="ocQ"><option value="4">4 位（Q4，最常用）</option><option value="8">8 位（Q8）</option>
        <option value="16">16 位（FP16）</option></select></div>
      <div class="calcrow"><label>上下文档位<span class="hint">决定的 KV cache 会额外吃显存</span></label>
        <select id="ocC"><option value="1">短（约 4K）</option><option value="3" selected>中（约 16K）</option>
        <option value="10">长（约 128K）</option></select></div>
      <div class="calcrow"><label>推理开销预留<span class="hint">框架 + 激活值，一般 15–25%</span></label>
        <input type="number" id="ocO" value="20" step="5"><span class="unit">%</span></div>
    </div>
    <div class="card">
      <div class="kv"><span>权重占用</span><span id="ocW">—</span></div>
      <div class="kv"><span>KV cache 预留（经验值）</span><span id="ocK">—</span></div>
      <div class="kv"><span>推理开销</span><span id="ocX">—</span></div>
      <div class="kv" style="border-top:1px solid #D7D2C8;border-bottom:none;padding-top:11px">
        <span style="color:var(--text)"><b>合计需要</b></span>
        <span id="ocT" class="bigv" style="font-size:24px;color:var(--accent)">—</span></div>
      <div style="margin-top:14px"><div id="ocAdvice"></div></div>
    </div>
  </div>

  <h3>经验档位（省得你算）</h3>
  <div class="tblwrap"><table class="tbl">
    <thead><tr><th>规模</th><th>显存</th><th>说明</th></tr></thead><tbody>
    ${C.oss.hw.map(h => `<tr><td><b>${esc(h.size)}</b></td><td>${esc(h.vram)}</td><td>${esc(h.note)}</td></tr>`).join('')}
    </tbody></table></div>
  <div class="warn" style="margin-top:14px">
    <b>别只看权重：</b>长上下文才是显存杀手。同样一个 32B 模型，4K 上下文可能 24G 够用，128K 上下文可能要 40G 以上。
    做长文档问答前，先按「长」档位算一遍。
  </div>`, v => {
  const calc = () => {
    const P = num(v.querySelector('#ocP').value);
    const bits = num(v.querySelector('#ocQ').value);
    const kv = num(v.querySelector('#ocC').value);
    const ov = num(v.querySelector('#ocO').value) / 100;
    const w = P * bits / 8;
    const total = (w + kv) * (1 + ov);
    v.querySelector('#ocW').textContent = w.toFixed(1) + ' GB';
    v.querySelector('#ocK').textContent = kv.toFixed(0) + ' GB';
    v.querySelector('#ocX').textContent = ((w + kv) * ov).toFixed(1) + ' GB';
    v.querySelector('#ocT').textContent = total.toFixed(1) + ' GB';
    let advice;
    if(total <= 8) advice = `<div class="ok"><b>单张消费级卡就能跑。</b>8G 显存够用，Ollama 一条命令。</div>`;
    else if(total <= 16) advice = `<div class="ok"><b>16G 显卡（4060Ti / 4070Ti）够。</b>本地部署的最舒服档位。</div>`;
    else if(total <= 24) advice = `<div class="ok"><b>24G 单卡（3090 / 4090）。</b>效果开始能当生产力用。</div>`;
    else if(total <= 48) advice = `<div class="warn"><b>需要双卡或大内存 Mac。</b>先确认你的任务值不值这个成本。</div>`;
    else advice = `<div class="gap"><b>个人不要本地部署。</b>直接用云 API 或托管服务。真正的判断点是：百万上下文对你到底有没有用。</div>`;
    v.querySelector('#ocAdvice').innerHTML = advice;
  };
  ['ocP','ocQ','ocC','ocO'].forEach(id => {
    v.querySelector('#' + id).oninput = calc;
    v.querySelector('#' + id).onchange = calc;
  });
  calc();
});

reg('csp-sim', () => {
  const plats = [
    { k:'tb', n:'淘宝联盟', r:3 },
    { k:'dy', n:'抖音联盟', r:6 },
    { k:'jd', n:'京东联盟', r:12 },
    { k:'wm', n:'外卖 CPS', r:2 }
  ];
  return `
  <h1>佣金结构模拟
    <small>同一笔 GMV 在不同平台佣金差一倍。这个模拟器告诉你「换结构」比「冲规模」见效快多少。</small></h1>
  <div class="grid g2" style="margin-top:18px">
    <div class="card">
      <div class="calcrow"><label>月 GMV 总额</label>
        <input type="number" id="csGmv" value="1000000" step="50000"><span class="unit">元</span></div>
      ${plats.map(p => `
        <div class="calcrow"><label>${p.n} 占比<span class="hint">佣金率默认 ${p.r}%</span></label>
          <input type="number" id="csR_${p.k}" value="0" step="5" style="width:64px"><span class="unit">%</span>
          <input type="number" id="csM_${p.k}" value="${p.r}" step="0.5" style="width:64px"><span class="unit">%佣</span>
        </div>`).join('')}
      <div class="note" style="margin-top:8px">占比合计：<b id="csSum">0%</b>　（不用凑满 100%，剩下算其他渠道）</div>
    </div>
    <div class="card">
      <div class="kv"><span>加权平均佣金率</span><span id="csAvg">—</span></div>
      <div class="kv"><span>当前月佣金收入</span><span id="csNow" style="color:#047857;font-size:16px">—</span></div>
      <div class="kv"><span>把 20% GMV 从淘宝迁到抖音</span><span id="csMove" style="color:#A16207;font-size:16px">—</span></div>
      <div class="kv"><span>差额（一年）</span><span id="csYear">—</span></div>
      <div style="margin-top:14px" id="csAdvice"></div>
    </div>
  </div>
  <div class="warn" style="margin-top:14px">
    <b>注意这不是「立刻照做」：</b>抖音佣金高，但也要求你有内容能力——纯导购链接在抖音跑不动。
    这个模拟器只算「钱」，不算「能力门槛」。
  </div>`;
}, v => {
  const calc = () => {
    const gmv = num(v.querySelector('#csGmv').value);
    const get = k => ({ share: num(v.querySelector('#csR_' + k).value), rate: num(v.querySelector('#csM_' + k).value) });
    const tb = get('tb'), dy = get('dy'), jd = get('jd'), wm = get('wm');
    const sum = tb.share + dy.share + jd.share + wm.share;
    const income = gmv * (tb.share * tb.rate + dy.share * dy.rate + jd.share * jd.rate + wm.share * wm.rate) / 10000;
    const avgRate = sum > 0 ? (tb.share * tb.rate + dy.share * dy.rate + jd.share * jd.rate + wm.share * wm.rate) / sum : 0;
    const mv = Math.min(20, tb.share);
    const diff = gmv * mv * (dy.rate - tb.rate) / 10000;
    v.querySelector('#csSum').textContent = sum + '%';
    v.querySelector('#csAvg').textContent = avgRate.toFixed(2) + '%';
    v.querySelector('#csNow').textContent = '¥' + Math.round(income).toLocaleString();
    v.querySelector('#csMove').textContent = (diff >= 0 ? '+' : '') + '¥' + Math.round(diff).toLocaleString();
    v.querySelector('#csYear').textContent = (diff >= 0 ? '+' : '') + '¥' + Math.round(diff * 12).toLocaleString();
    v.querySelector('#csAdvice').innerHTML = diff > 0
      ? `<div class="ok"><b>迁 20% 的 GMV，一年多 ${Math.round(diff*12).toLocaleString()} 元。</b>
         这就是「佣金率差 3 个点」在百万级 GMV 上的真实杠杆。前提是你得能做内容。</div>`
      : `<div class="gap"><b>当前结构下迁移没有增益。</b>先把淘宝占比填进去再试。</div>`;
  };
  ['csGmv','csR_tb','csR_dy','csR_jd','csR_wm','csM_tb','csM_dy','csM_jd','csM_wm'].forEach(id => {
    v.querySelector('#' + id).oninput = calc;
  });
  // 预填一个典型结构
  v.querySelector('#csR_tb').value = 40;
  v.querySelector('#csR_dy').value = 30;
  v.querySelector('#csR_jd').value = 15;
  v.querySelector('#csR_wm').value = 10;
  calc();
});

<script>
/* ==================== js/score.js ==================== */
/* 蓝鲸 · 综合工作台 —— 选品分析引擎
 * 与 Excel 版同一套算法（已重算核对：84 / 66 / 43）。
 * 注册三个模块：cross-score（打分器）/ cross-an（分析）/ cross-param（参数）
 */
(function(){
  const LS = 'workbench_xuanpin_v2';
  let uid = 1;
  let storageOK = true;
  try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); }catch(e){ storageOK = false; }

  const P0 = () => ({
    w:{ logi:25, marg:20, ret:15, comp:15, dem:10, inno:10, sup:5 },
    pass:70, watch:60,
    loss:0.4, vol:6, bulk:1.5, pen:2,
    logi:[{max:300,s:10},{max:500,s:9},{max:800,s:6},{max:1200,s:3}], logiFb:1,
    marg:[{min:30,s:10},{min:25,s:8},{min:20,s:6},{min:15,s:3}], margFb:0,
    ret:[{max:5,s:10},{max:8,s:8},{max:12,s:6},{max:20,s:3}], retFb:1,
    platforms:[
      {n:'Temu 全托管',r:8},{n:'Temu 半托管',r:10},{n:'美客多 跨境店',r:16},{n:'美客多 本土店',r:16},
      {n:'Ozon FBS',r:26},{n:'Ozon FBO',r:20},{n:'TikTok Shop',r:18},{n:'Shopee',r:12},
      {n:'Amazon',r:15},{n:'独立站',r:3}
    ]
  });
  const wid = r => (r.id = uid++, r);
  const samples = () => [
    {name:'折叠宠物饮水碗（硅胶）', plat:'Temu 半托管', price:'18', wt:'180', L:'20', W:'15', H:'8',
     cost:'5', ship:'2.8', comm:10, tax:'0', ret:'5', other:'0.6', comp:8, dem:8, inno:7, sup:9},
    {name:'桌面抽屉分隔收纳盒 4件套', plat:'Temu 全托管', price:'12.5', wt:'420', L:'32', W:'24', H:'12',
     cost:'3.2', ship:'2.1', comm:8, tax:'0', ret:'6', other:'0.45', comp:9, dem:9, inno:5, sup:8},
    {name:'加厚卫衣（女款）', plat:'TikTok Shop', price:'26', wt:'520', L:'30', W:'25', H:'6',
     cost:'9', ship:'5.2', comm:18, tax:'0', ret:'32', other:'1.8', comp:9, dem:6, inno:4, sup:6}
  ].map(wid);

  const XP = (function(){
    try{
      const raw = localStorage.getItem(LS);
      if(raw){
        const d = JSON.parse(raw);
        if(d && d.params && Array.isArray(d.rows)){
          d.rows.forEach(r => r.id = uid++);
          return { params:d.params, rows:d.rows, detail:null, search:'', sortKey:'total', sortDir:-1 };
        }
      }
    }catch(e){}
    return { params:P0(), rows:samples(), detail:null, search:'', sortKey:'total', sortDir:-1 };
  })();

  let saveT = null;
  function save(){
    clearTimeout(saveT);
    saveT = setTimeout(() => {
      try{ localStorage.setItem(LS, JSON.stringify({params:XP.params, rows:XP.rows})); }catch(e){}
    }, 350);
  }

  /* ---------- 计算引擎（与 Excel 完全一致） ---------- */
  const isBlank = v => v === '' || v === null || v === undefined;
  const n = v => { const x = parseFloat(v); return isFinite(x) ? x : 0; };
  const r1 = v => Math.round(v * 10) / 10;

  function calcRow(row, P, mod){
    mod = mod || {};
    const shipMul = mod.shipMul || 1, priceMul = mod.priceMul || 1, retAdd = mod.retAdd || 0;
    const price = n(row.price) * priceMul, wt = n(row.wt);
    const volw = (n(row.L) && n(row.W) && n(row.H)) ? n(row.L) * n(row.W) * n(row.H) / (P.vol || 6) : 0;
    const bill = Math.max(wt, volw);

    let gross = null, gm = null;
    if(!isBlank(row.price) && !isBlank(row.cost) && !isBlank(row.ship)){
      const retEff = Math.max(0, n(row.ret) + retAdd);
      gross = price - n(row.cost) - n(row.ship) * shipMul
            - price * n(row.comm) / 100 - price * n(row.tax) / 100
            - n(row.other) - price * retEff / 100 * (P.loss || 0.4);
      gm = price > 0 ? gross / price : 0;
    }
    let sLogi = null;
    if(bill > 0){
      sLogi = P.logiFb;
      for(const t of P.logi){ if(bill <= n(t.max)){ sLogi = n(t.s); break; } }
      if(wt > 0 && volw > wt * n(P.bulk)) sLogi = Math.max(1, sLogi - n(P.pen));
    }
    let sMarg = null;
    if(gm !== null){
      sMarg = P.margFb;
      for(const t of P.marg){ if(gm * 100 >= n(t.min)){ sMarg = n(t.s); break; } }
    }
    let sRet = null;
    if(!isBlank(row.ret)){
      sRet = P.retFb;
      for(const t of P.ret){ if(n(row.ret) <= n(t.max)){ sRet = n(t.s); break; } }
    }
    let total = null, verdict = '';
    if(sLogi !== null && sMarg !== null && sRet !== null){
      const W = P.w;
      total = r1((sLogi * W.logi / 100 + sMarg * W.marg / 100 + sRet * W.ret / 100
        + n(row.comp) * W.comp / 100 + n(row.dem) * W.dem / 100
        + n(row.inno) * W.inno / 100 + n(row.sup) * W.sup / 100) * 10);
      verdict = total >= P.pass ? 'y' : (total >= P.watch ? 'w' : 'n');
    }
    return { volw, bill, gross, gm, sLogi, sMarg, sRet, total, verdict };
  }
  const calcAll = mod => XP.rows.map(row => ({ row, c: calcRow(row, XP.params, mod) }));
  const wSum = () => { const W = XP.params.w; return W.logi+W.marg+W.ret+W.comp+W.dem+W.inno+W.sup; };

    height:34px;max-height:34px;overflow:hidden}
  table.xg tr:hover td{background:rgba(23,22,27,.022)}
  table.xg td input{width:100%;height:34px;background:transparent;border:none;outline:none;color:var(--text);
    font-size:12.5px;font-family:inherit;text-align:center;padding:0 4px;font-variant-numeric:tabular-nums;
    text-overflow:ellipsis;white-space:nowrap}
  table.xg td input:focus{background:rgba(79,70,229,.14);box-shadow:inset 0 0 0 1px var(--blue)}
  table.xg td.txt input{text-align:left;padding-left:8px}
  table.xg td.calc{background:#FBFAF7;color:#6B6874;font-size:12px;font-variant-numeric:tabular-nums}
  table.xg td.calc.bad{color:var(--red)}
  table.xg td.calc.good{color:var(--green)}
  table.xg td.stick{position:sticky;z-index:2;background:var(--panel)}
  table.xg th.stick{z-index:6}

  td.sc{font-weight:800;font-size:13.5px;font-variant-numeric:tabular-nums}
  td.sc.y{color:#047857} td.sc.w{color:var(--gold)} td.sc.n{color:var(--red)}

  td.vd.y{color:#047857} td.vd.w{color:var(--gold)} td.vd.n{color:var(--red)}

    background:rgba(4,120,87,.07);border:1px solid rgba(4,120,87,.25);font-size:12.5px}

  .prow2 input[type=number],.prow2 input[type=text]{width:78px;background:var(--input);border:1px solid var(--line2);

  const esc2 = s => String(s === undefined || s === null ? '' : s)

  const toast = m => window.toast ? window.toast(m) : 0;

  /* ---------- 表格列 ---------- */
  const COLS = [
    {k:'name', t:'候选品名', w:180, stick:'0'},
    {k:'__total', t:'综合分', w:62, auto:1, stick:'180'},

    {k:'L', t:'长', w:42},

    {k:'__bill', t:'计费重g', w:64, auto:1},
    {k:'cost', t:'采购$', w:56},
    {k:'ship', t:'物流$', w:56},
    {k:'comm', t:'佣金%', w:52},

    {k:'dem', t:'需求', w:42},

    {k:'sup', t:'补货', w:42}
  ];
  const sortKeyOf = c => c.k === '__bill' ? 'bill' : c.k === '__gross' ? 'gross'
    : c.k === '__gm' ? 'gm' : c.k === '__total' ? 'total' : c.k;

  function rowsForDisplay(){
    let list = calcAll();
    const q = XP.search.trim().toLowerCase();
    if(q) list = list.filter(x => ((x.row.name||'') + (x.row.plat||'')).toLowerCase().includes(q));
    const k = XP.sortKey, dir = XP.sortDir;
    const val = x => {
      if(k === 'total') return x.c.total === null ? -1 : x.c.total;
      if(k === 'gm') return x.c.gm === null ? -1 : x.c.gm;
      if(k === 'bill') return x.c.bill || 0;
      if(k === 'gross') return x.c.gross === null ? -1e9 : x.c.gross;

  /* ---------- 模块一：打分器 ---------- */
  reg('cross-score', () => {

    return `
    <h1>选品打分器
      <small>填关键数就行：重量、长宽高、成本、退货率。灰底列全部实时算。点「详情」看每一分怎么来的。</small></h1>

      ${kpi('权重合计', wSum().toFixed(0) + '%', Math.abs(wSum()-100)<0.5 ? '正常' : '需要调整', Math.abs(wSum()-100)<0.5 ? '#047857' : '#BE123C')}

        <th class="${c.auto?'auto':''} ${c.stick?'stick':''} ${c.k==='name'?'nm':''} ${XP.sortKey===sortKeyOf(c)?'sorted':''}"
