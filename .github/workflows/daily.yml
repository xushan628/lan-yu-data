name: 每日采集

on:
  schedule:
    # 北京时间 08:00 = UTC 00:00
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests beautifulsoup4 lxml

      - name: 采集（抖音 + 亚马逊）
        env:
          TIKHUB_API_KEY: ${{ secrets.TIKHUB_API_KEY }}
        run: python scripts/scrape_all.py

      - name: 提交结果
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "数据没有变化，跳过提交"
          else
            git commit -m "chore: 采集数据 $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
